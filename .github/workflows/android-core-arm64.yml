name: Android Core ARM64

# Builds the Android ARM64 core the product actually ships, through the product's own builder.
#
# # Why this exists
#
# Every other artifact workflow here is manual dispatch, and until this one existed the Android
# target had no CI at all: the only thing a push triggered was Verify, which is a structural gate and
# builds nothing for mobile. So the builder could have been broken for a week and nothing would have
# said so.
#
# # Why it calls cmd/internal/build_libbox instead of running gomobile itself
#
# CI build path == product build path, or the workflow is theatre. The feature tag set is NOT written
# here: it comes from ResolveBuildTags("android-main"), the same function the release builder and the
# provenance record use. A workflow that re-listed the tags would be a second source of truth, and the
# first thing it would do is drift - which is exactly how the phase-1 gVisor exposure hid, when a
# check read the profile tag FILES while the builder composed its own set.
#
# # What it verifies beyond "the build exited 0"
#
#   * the provenance file's commit equals GITHUB_SHA (a build that reports a different commit than the
#     one it was asked to build is not a build of that commit);
#   * the resolved tags carry no gVisor and DO carry the mobile geometry, so a silent revert of either
#     product decision fails here rather than in a shipped artifact;
#   * the AAR really contains an AArch64 jni/arm64-v8a/libbox.so, is non-empty, and carries the tag
#     set and no gvisor module in its Go build info. "The aar exists" is not the assertion.

on:
  workflow_dispatch:
  push:
    branches: [testing]
    paths:
      - 'cmd/internal/build_libbox/**'
      - 'cmd/internal/mobilebuildtags/**'
      - 'cmd/internal/applebuildtags/**'
      - 'experimental/libbox/**'
      - 'protocol/**'
      - 'route/**'
      - 'dns/**'
      - 'transport/**'
      - 'service/**'
      - 'common/**'
      - 'adapter/**'
      - 'option/**'
      - 'constant/**'
      - 'release/**'
      - 'go.mod'
      - 'go.sum'
      - '.github/workflows/android-core-arm64.yml'

permissions:
  contents: read

# `group` is keyed by the ref AND the event, so a newer push to the same ref supersedes
# the run the previous push started - this workflow builds the ARM64 core on every push
# that touches the product sources, and a superseded commit's 15-minute native build is
# pure wall clock.
#
# A manual dispatch is deliberately NOT cancellable: `github.event_name` puts it in a
# group of its own and `cancel-in-progress` is false for it, so a dispatch can never be
# cancelled by a push - and a dispatch is how a release artifact is produced.
concurrency:
  group: android-core-arm64-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: ${{ github.event_name != 'workflow_dispatch' }}

jobs:
  android-core-arm64:
    name: Android ARM64 core
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          fetch-depth: 0
          # Only the Android client is checked out, and only because the build pins live in it.
          #
          # clients/android is a submodule (SagerNet/sing-box-for-android), so the NDK version this
          # workflow derives is NOT in the superproject and an uninitialised checkout has no
          # gradle.properties to read. clients/apple is deliberately NOT fetched: it is a large
          # submodule with its own signing and provisioning config, nothing in an Android build needs
          # it, and pulling it would slow every run and couple this workflow to Apple release state.

      - name: Check out the Android client submodule
        run: |
          set -euo pipefail
          git submodule update --init --depth 1 clients/android
          if [ ! -f clients/android/gradle.properties ]; then
            echo "FAIL: clients/android was not checked out; the NDK pin cannot be read" >&2
            exit 1
          fi
          echo "android client at $(git -C clients/android rev-parse --short HEAD)"

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      # Cheap structural gates first, so a failure lands near its cause instead of at the end of a
      # 15-minute native build. They run before the JDK, the NDK download and the gomobile install
      # below: gofmt, the module graph and the tag policy answer in seconds, and the NDK is the
      # single slowest install in this job (~1 GB through sdkmanager) - a tag or format break must
      # not wait for it.
      - name: Format gate
        run: |
          unformatted="$(gofmt -l $(git ls-files '*.go' | grep -v '^clients/') || true)"
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "PASS: gofmt clean"

      - name: Module integrity
        run: |
          go mod tidy -diff
          go mod verify

      - name: Tag policy and builder tests
        run: go test -count=1 ./cmd/internal/... ./cmd/ci-artifact-probe/...

      - name: Emit the resolved tags and assert the product decisions
        run: |
          go run ./cmd/internal/build_libbox -print-resolved-tags android-main > /tmp/android-tags.txt
          cat /tmp/android-tags.txt
          python3 - <<'PY'
          tags = open('/tmp/android-tags.txt').read().strip().split(',')
          # gVisor was retired when the Android UI stopped depending on mixed/gvisor. It must not come
          # back silently; the tag_policy test is the primary tripwire and this is the second one, on
          # the resolved set the product actually compiles.
          assert 'with_gvisor' not in tags, 'Android must not ship with_gvisor: %r' % (tags,)
          # The mobile buffer geometry is a product decision made on measured evidence.
          assert 'with_low_memory' in tags, 'Android must ship the mobile geometry: %r' % (tags,)
          print('PASS: android-main carries the mobile geometry and no gVisor')
          PY

      # JDK 17 and the NDK version are pinned rather than floated: a toolchain that changes under the
      # build would make a green run mean something different each week.
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # The Android SDK is preinstalled on the GitHub runner; only the NDK is added.
      #
      # android-actions/setup-android is deliberately NOT used. Its v3 build runs
      # `sdkmanager "tools"` during setup, and the `tools` package no longer exists in the current
      # SDK repository, so the action fails with `Failed to find package 'tools'` and a nonzero
      # sdkmanager exit - inside the action, before any of this workflow's own steps run. The
      # runner's image already ships cmdline-tools and a populated SDK, so the action was doing
      # nothing this needs, and the NDK installs fine directly.
      #
      # The NDK VERSION IS DERIVED, from the same file the Android client uses. A literal here is a
      # second source of truth, and it was wrong: this workflow pinned 27.0.12077973 while the client
      # pins 28.0.13004108 in clients/android/gradle.properties. That is not a cosmetic difference -
      # the older NDK's linker cannot process a relocation in the prebuilt Cronet static library
      # ("unknown relocation (315) against symbol typeinfo for std::domain_error"), so CI failed at
      # the product link with a toolchain the product does not use.
      - name: Install NDK
        run: |
          set -euo pipefail
          SDK_ROOT="${ANDROID_SDK_ROOT:-${ANDROID_HOME:-/usr/local/lib/android/sdk}}"
          echo "ANDROID_SDK_ROOT=$SDK_ROOT" >> "$GITHUB_ENV"
          NDK_VERSION="$(sed -n 's/^ndkVersion[[:space:]]*=[[:space:]]*//p' clients/android/gradle.properties | tr -d '[:space:]')"
          if [ -z "$NDK_VERSION" ]; then
            echo "FAIL: no ndkVersion in clients/android/gradle.properties; refusing to guess one" >&2
            exit 1
          fi
          echo "ndk version (from the client's gradle.properties): $NDK_VERSION"
          SDKMANAGER="$(find "$SDK_ROOT/cmdline-tools" -name sdkmanager -type f 2>/dev/null | head -1)"
          if [ -z "$SDKMANAGER" ]; then
            echo "FAIL: no sdkmanager under $SDK_ROOT/cmdline-tools; the runner image changed" >&2
            ls "$SDK_ROOT" >&2 || true
            exit 1
          fi
          # </dev/null, NOT `yes |`. Under `set -o pipefail` a `yes |` pipeline fails with
          # "yes: standard output: Broken pipe" the moment sdkmanager exits, so the install reports
          # failure even when it succeeded.
          "$SDKMANAGER" --install "ndk;$NDK_VERSION" </dev/null >/dev/null
          NDK_DIR="$SDK_ROOT/ndk/$NDK_VERSION"
          if [ ! -d "$NDK_DIR" ]; then
            echo "FAIL: the NDK was not installed at $NDK_DIR" >&2
            ls "$SDK_ROOT/ndk" >&2 || true
            exit 1
          fi
          echo "ANDROID_NDK_HOME=$NDK_DIR" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_DIR" >> "$GITHUB_ENV"
          echo "PASS: NDK $NDK_VERSION at $NDK_DIR"

      # The project's OWN gomobile fork, at the version root go.mod pins. NOT golang.org/x/mobile.
      #
      # This is a source-of-truth rule, not a convenience. root go.mod requires
      # github.com/sagernet/gomobile, which is the toolchain this project's Android product is built
      # with; installing upstream golang.org/x/mobile instead means CI builds with a DIFFERENT
      # generator than the product, and the two can disagree about binding output.
      #
      # It also fails outright: x/mobile@latest now carries `go >= 1.26.0`, so GOTOOLCHAIN tries to
      # fetch go1.26.9 as a module and the proxy 404s, which is how this workflow first appeared to be
      # blocked by the environment. The pin has a go directive of 1.23 and needs no toolchain jump.
      #
      # The version is DERIVED, never copied: a literal here would be a second source of truth and
      # would silently diverge the first time go.mod moves.
      - name: Install the pinned gomobile toolchain
        run: |
          set -euo pipefail
          GOMOBILE_VERSION="$(go list -m -f '{{.Version}}' github.com/sagernet/gomobile)"
          if [ -z "$GOMOBILE_VERSION" ] || [ "$GOMOBILE_VERSION" = "null" ]; then
            echo "FAIL: root go.mod does not require github.com/sagernet/gomobile" >&2
            exit 1
          fi
          echo "gomobile module: github.com/sagernet/gomobile@$GOMOBILE_VERSION"
          go install "github.com/sagernet/gomobile/cmd/gomobile@$GOMOBILE_VERSION"
          go install "github.com/sagernet/gomobile/cmd/gobind@$GOMOBILE_VERSION"
          gobin="$(go env GOPATH)/bin"
          echo "$gobin" >> "$GITHUB_PATH"
          for tool in gomobile gobind; do
            if [ ! -x "$gobin/$tool" ]; then
              echo "FAIL: $tool was not installed to $gobin" >&2
              ls "$gobin" >&2 || true
              exit 1
            fi
          done
          # Prove WHICH MODULE the binaries came from by reading their build info, not by asking
          # `gomobile version`.
          #
          # `gomobile version` prints "gomobile version unknown: binary is out of date, re-install it"
          # for a binary installed with `go install` from a module, because it looks for a version
          # file that only exists in its own release layout. Treating that as a version mismatch
          # failed this step even though the install was fine. `go version -m` reads the stamped
          # module path and version out of the binary itself, which is both reliable and a stronger
          # statement - it names the exact module the toolchain was built from.
          for tool in gomobile gobind; do
            echo "--- $tool build info"
            go version -m "$gobin/$tool" | sed -n '1,8p'
            if ! go version -m "$gobin/$tool" | grep -q "github.com/sagernet/gomobile[[:space:]]*$GOMOBILE_VERSION"; then
              echo "FAIL: $gobin/$tool was not built from github.com/sagernet/gomobile@$GOMOBILE_VERSION" >&2
              exit 1
            fi
          done
          echo "PASS: gomobile and gobind are built from the pinned fork at $GOMOBILE_VERSION"

      # The real build, through the product's own builder. -platform selects the single ARM64 target:
      # an all-ABI AAR would not prove the ARM64 payload works, it would only prove gomobile can run.
      - name: Build libbox (android/arm64)
        run: |
          go run ./cmd/internal/build_libbox -target android -platform android/arm64

      - name: Verify provenance and the ARM64 payload
        run: |
          set -euo pipefail
          # The builder's real output paths, and they are not the same directory. writeProvenance
          # writes "libbox.provenance" relative to the working directory, but the AAR is written to an
          # ABSOLUTE path inside the builder's isolated working directory - buildAndroidVariant does
          # `outputPath := filepath.Join(gomobileWorkDir(rootDir), config.OutputName)` with
          # gomobileWorkDirName = "_libbox_build" - so it is _libbox_build/libbox.aar and never the
          # working directory. Both paths are exact rather than searched for: a `find` here would
          # accept an artifact from anywhere in the tree, including a stale one left by an earlier
          # step, which is precisely what this check exists to rule out.
          prov="libbox.provenance"
          if [ ! -f "$prov" ]; then
            echo "FAIL: the builder did not write $prov; it did not record what it built" >&2
            ls -la | head -20 >&2
            exit 1
          fi
          echo "--- $prov ---"; cat "$prov"
          prov_commit="$(sed -n 's/^commit=//p' "$prov")"
          if [ "$prov_commit" != "$GITHUB_SHA" ]; then
            echo "FAIL: provenance commit '$prov_commit' != GITHUB_SHA '$GITHUB_SHA'" >&2
            exit 1
          fi
          echo "PASS: provenance names the commit that was built"

          aar="_libbox_build/libbox.aar"
          if [ ! -f "$aar" ]; then
            echo "FAIL: the builder did not produce $aar" >&2
            ls -la _libbox_build 2>&1 | head -20 >&2
            exit 1
          fi
          echo "aar: $aar ($(stat -c%s "$aar") bytes)"
          rm -rf /tmp/aar && mkdir -p /tmp/aar && unzip -q "$aar" -d /tmp/aar
          find /tmp/aar -name '*.so' -printf '%p %s\n' | sort

          so="$(find /tmp/aar -path '*arm64-v8a*' -name 'libbox.so' | head -1)"
          if [ -z "$so" ]; then
            echo "FAIL: the AAR has no jni/arm64-v8a/libbox.so; this build claims ARM64" >&2
            exit 1
          fi
          size="$(stat -c%s "$so")"
          if [ "$size" -lt 1000000 ]; then
            echo "FAIL: $so is only $size bytes; an ARM64 libbox is far larger than that" >&2
            exit 1
          fi
          arch="$(file -b "$so")"
          echo "arch: $arch"
          case "$arch" in
            *aarch64*|*AArch64*|*ARM*64*) echo "PASS: AArch64" ;;
            *) echo "FAIL: $so is not AArch64: $arch" >&2; exit 1 ;;
          esac
          # A build-info read is the strongest statement available about what is inside: it comes from
          # the artifact, not from the script that produced it.
          if command -v go >/dev/null && go version -m "$so" >/tmp/so-buildinfo.txt 2>/dev/null; then
            if grep -q 'with_gvisor' /tmp/so-buildinfo.txt; then
              echo "FAIL: the ARM64 .so was built with_gvisor" >&2; exit 1
            fi
            if grep -q 'gvisor' /tmp/so-buildinfo.txt; then
              echo "FAIL: the ARM64 .so links a gVisor module" >&2
              grep gvisor /tmp/so-buildinfo.txt >&2; exit 1
            fi
            echo "PASS: the ARM64 .so carries no gVisor module and no with_gvisor tag"
          else
            echo "NOTE: build info not readable from this .so; architecture and size were still checked"
          fi
          sha256sum "$aar" "$so" "$prov" | tee SHA256SUMS.txt

      - name: Report
        if: always()
        run: |
          {
            echo "## Android Core ARM64"
            echo ""
            echo "| | |"
            echo "|---|---|"
            echo "| commit | \`$GITHUB_SHA\` |"
            echo "| go | \`$(go version)\` |"
            echo "| java | \`$(java -version 2>&1 | head -1)\` |"
            echo "| ndk | \`${ANDROID_NDK_HOME:-unset}\` |"
            echo "| target abi | android/arm64 |"
            echo "| resolved tags | \`$(cat /tmp/android-tags.txt 2>/dev/null || echo unavailable)\` |"
            echo "| aar | \`libbox.aar\` |"
            echo "| sha256 | see the SHA256SUMS.txt artifact |"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload artifacts
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: android-core-arm64-${{ github.sha }}
          path: |
            _libbox_build/libbox.aar
            libbox.provenance
            SHA256SUMS.txt
          if-no-files-found: error
