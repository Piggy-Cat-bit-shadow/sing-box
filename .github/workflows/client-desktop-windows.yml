name: Windows desktop installer

# Builds, signs, installs and tears down the Windows x64 desktop client.
#
# # What this workflow proves, and what it cannot
#
# It proves the pipeline: source and toolchain, build, package integrity, architecture,
# Authenticode signing, daemon service registration, the installer's install/reinstall/
# uninstall lifecycle, and the signature state of the driver packages.
#
# It cannot prove the product works. TUN, WinDivert traffic interception, DNS, the system
# proxy, IPC under load, sleep/wake and network switching are properties of a real Windows
# machine, and a hosted runner is not one. Those live in docs/WINDOWS-ACCEPTANCE.md, and a
# green run here is "the installer is releasable to test", not "the client works".
#
# # Gates
#
#   1 source / toolchain    core commit, version, desktop pin, Go, Node, pnpm, Rust
#   2 build                 daemon, dashboard, Electron, NSIS - signed with a throwaway
#                           certificate this run creates and destroys
#   3 static package        asar integrity, Electron fuses, daemon provenance,
#                           PE architecture, and the payload extracted from the installer
#   4 signing               every binary Authenticode-signed by THIS run's certificate,
#                           and all of them by the same one
#   5 daemon service        install, SCM registration, Running, status, stop, uninstall
#   6 installer lifecycle   silent install, verify, same-version reinstall, uninstall,
#                           clean reinstall, final uninstall
#   7 driver packages       embedded signature or catalog coverage for every .sys
#   8 records               slim text artifacts only
#
# # Why a throwaway signing certificate
#
# The unsigned path exists so a development build needs no certificate, and it is kept.
# But the core's Windows daemon authenticates the application against its own signer and
# refuses to register the service - and refuses every peer handshake - when they differ.
# A build that has never been signed has never exercised that, and the installer runs
# `service install` and rolls back when it fails. So CI signs with a certificate it
# generates and deletes: the real code path, no long-lived secret, nothing uploaded.
#
# # Why the core is checked out at the v0.1.5 commit rather than at this branch
#
# scripts/package.ts builds the daemon from the core checkout beside the desktop client,
# and cmd/internal/build_boxdd stamps the version from `git describe --tags` in that
# checkout. That commit therefore fixes the daemon's version string, supplies the tags
# `git describe` needs, and records clients/desktop at the pin this release ships
# (32f915ba). One checkout, both revisions, and the overlay is applied to that client.

# # Gating status
#
# Release-blocking: the build, the package, static integrity, daemon provenance, the PE
# architecture audit and the hash records.
#
# Experimental and NOT release-blocking: the daemon service gates, the NSIS install lifecycle
# and the driver package audit. They are useful and they are kept, but a green run is not
# Windows acceptance - UAC, Program Files ACLs, real service behaviour across reinstall,
# driver loading, TUN, the system proxy, reboot, sleep/wake and long-running stability are
# properties of a real Windows machine that a hosted runner cannot represent.
#
# The Windows runtime line is FROZEN pending a real Windows x64 debugging environment. See
# docs/WINDOWS-STATUS.md. Do not weaken a security check to make a gate pass, and do not
# delete a gate: fix the harness when the harness is wrong, and investigate on real hardware
# when the product is.

on:
  workflow_dispatch:

permissions:
  contents: read

env:
  CORE_SHA: e70f3d2c8527ca159231f11405be52604008504c
  CORE_VERSION: "0.1.5"
  CLIENT_DIR: core/clients/desktop
  RECORDS_DIR: build/records
  SERVICE_WORK_DIR: C:\ProgramData\sing-box-daemon-ci-smoke

jobs:
  installer:
    name: unsigned-build / signed-test / install-lifecycle
    # `windows-latest` rather than a pinned image label, deliberately.
    #
    # Pinning would reduce drift, but this pipeline's needs - Electron 43, Node 26, Go
    # 1.26, the Rust MSVC toolchain, the Windows SDK for signtool, 7-Zip for the payload
    # extraction, and NSIS - are all satisfied by the current image, and pinning to a label
    # that GitHub later retires fails a release for a reason that has nothing to do with
    # the release. Instead the image, the Windows build, the Visual Studio toolset, the
    # Windows SDK versions and the elevation state are recorded in the build record, so a
    # future failure caused by an image move is attributable from the artifact rather than
    # guessed at. Gate 1 writes that record before anything is built.
    runs-on: windows-latest
    timeout-minutes: 120

    steps:
      # --- GATE 1: source and toolchain -------------------------------------
      - name: "[gate 1] check out the publishing tooling"
        uses: actions/checkout@v4
        with:
          path: tooling
          fetch-depth: 1

      - name: "[gate 1] check out the v0.1.5 core"
        uses: actions/checkout@v4
        with:
          path: core
          ref: ${{ env.CORE_SHA }}
          # Submodules are initialised below, for the desktop client only: the core also
          # records clients/apple and clients/android and neither is used here.
          fetch-depth: 0
          fetch-tags: true

      - name: "[gate 1] check out the pinned desktop client and its dashboard"
        shell: bash
        run: git -C core submodule update --init --recursive clients/desktop

      - name: "[gate 1] confirm the core checkout is the source of record"
        shell: bash
        run: |
          set -euo pipefail
          head_sha="$(git -C core rev-parse HEAD)"
          echo "core HEAD:      $head_sha"
          echo "core describe:  $(git -C core describe --tags)"
          [ "$head_sha" = "$CORE_SHA" ] || {
            echo "FAIL: core is at $head_sha, expected $CORE_SHA" >&2; exit 1; }
          [ "$(git -C core describe --tags)" = "v$CORE_VERSION" ] || {
            echo "FAIL: the daemon version stamp derives from \`git describe --tags\`," >&2
            echo "      which must be v$CORE_VERSION in this checkout" >&2; exit 1; }
          echo "desktop client: $(git -C core rev-parse HEAD:clients/desktop)"
          echo "desktop HEAD:   $(git -C "$CLIENT_DIR" rev-parse HEAD)"

      - name: "[gate 1] read the client's declared toolchain"
        id: toolchain
        shell: bash
        run: |
          node --input-type=module -e '
            import { readFileSync, appendFileSync } from "node:fs";
            const version = JSON.parse(readFileSync("core/clients/desktop/version.json", "utf8"));
            const manifest = JSON.parse(readFileSync("core/clients/desktop/package.json", "utf8"));
            const go = version.go_version.replace(/^go/u, "");
            const pnpm = manifest.packageManager.split("@")[1];
            appendFileSync(process.env.GITHUB_OUTPUT, `go=${go}\nnode=${manifest.engines.node}\npnpm=${pnpm}\n`);
            console.log(`go=${go} node=${manifest.engines.node} pnpm=${pnpm}`);
          '

      - name: "[gate 1] install Go ${{ steps.toolchain.outputs.go }}"
        uses: actions/setup-go@v5
        with:
          go-version: ${{ steps.toolchain.outputs.go }}
          # The Go module graph this job builds is the CORE checkout's, not this
          # repository's: `pnpm run package:win` runs build_boxdd inside `core`, which
          # is pinned at CORE_SHA. That is why caching was off - setup-go's default key
          # is the root go.sum, and there is no root go.sum here (the publishing tooling
          # is checked out under `tooling/`, `core/` and `build/` are the only other
          # roots), so the default key would either not resolve or key on a file the
          # build never reads. Keyed on core/go.sum the cache is correct and stable
          # across runs, because the core pin is a fixed commit: the daemon's whole
          # dependency graph is downloaded once instead of on every run.
          cache: true
          cache-dependency-path: core/go.sum

      - name: "[gate 1] install Node ${{ steps.toolchain.outputs.node }}"
        uses: actions/setup-node@v4
        with:
          node-version: ${{ steps.toolchain.outputs.node }}

      - name: "[gate 1] install pnpm ${{ steps.toolchain.outputs.pnpm }}"
        uses: pnpm/action-setup@v4
        with:
          version: ${{ steps.toolchain.outputs.pnpm }}

      - name: "[gate 1] record the toolchain and the runner"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          . (Join-Path $PWD "tooling/scripts/ci/windows/GateHelpers.ps1")
          New-Item -ItemType Directory -Path $env:RECORDS_DIR -Force | Out-Null
          $lines = New-Object System.Collections.Generic.List[string]
          $lines.Add("windows build environment")
          $lines.Add("core SHA           $env:CORE_SHA")
          $lines.Add("core version       $env:CORE_VERSION")
          $lines.Add("desktop client     $(git -C core rev-parse HEAD:clients/desktop)")
          $lines.Add("tooling commit     $(git -C tooling rev-parse HEAD)")
          $lines.Add("runner image       $env:ImageOS $env:ImageVersion")
          $os = Get-CimInstance Win32_OperatingSystem
          $lines.Add("windows            $($os.Caption) $($os.Version) build $($os.BuildNumber)")
          $lines.Add("go                 $(go version)")
          $lines.Add("node               $(node --version)")
          $lines.Add("pnpm               $(pnpm --version)")
          $lines.Add("rustc              $(rustc --version)")
          $lines.Add("cargo              $(cargo --version)")
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          if (Test-Path $vswhere) {
            $vs = & $vswhere -latest -products * -property displayName,installationVersion 2>$null
            if ($LASTEXITCODE -eq 0 -and $vs) { $lines.Add("visual studio      $($vs -join ' ')") }
          }
          $sdkRoot = "${env:ProgramFiles(x86)}\Windows Kits\10\Include"
          if (Test-Path $sdkRoot) {
            $lines.Add("windows SDK        $((Get-ChildItem $sdkRoot -Directory | Select-Object -ExpandProperty Name) -join ', ')")
          }
          $identity = [Security.Principal.WindowsIdentity]::GetCurrent()
          $principal = New-Object Security.Principal.WindowsPrincipal($identity)
          $elevated = $principal.IsInRole([Security.Principal.WindowsBuiltInRole]::Administrator)
          $lines.Add("runner user        $($identity.Name) elevated=$elevated")
          [System.IO.File]::WriteAllLines("$env:RECORDS_DIR/runner-environment.txt", $lines)
          $lines | ForEach-Object { Write-Host $_ }
          if (-not $elevated) {
            Write-Host "::warning::the runner is not elevated, so the daemon service and installer lifecycle gates will fail with that as their reason"
          }
          # The step's verdict is its own, and it is a real one: a report that silently
          # recorded nothing is worse than no report. Complete-Gate then exits with this
          # decision rather than inheriting the status of whichever native command ran last.
          foreach ($tool in @("go", "node", "rustc")) {
            $recorded = $lines | Where-Object { $_ -match "^$tool\s+\S" }
            if ($null -eq $recorded) {
              Write-Error "the environment report is missing a version for $tool"
              exit 1
            }
          }
          Complete-Gate

      # --- GATE 2: build ----------------------------------------------------
      - name: "[gate 2] create the throwaway test signing certificate"
        shell: pwsh
        run: |
          ./tooling/scripts/ci/windows/New-TestSigningCertificate.ps1 -ClientDirectory $env:CLIENT_DIR

      - name: "[gate 2] apply the Jiejiebox branding and unsigned-build overlay"
        shell: bash
        env:
          DESKTOP_CLIENT_DIR: ${{ env.CLIENT_DIR }}
          PYTHON: python
        run: bash tooling/scripts/ci/prepare-desktop-client.sh

      - name: "[gate 2] confirm the overlay set the executable name the core authenticates"
        shell: bash
        run: |
          set -euo pipefail
          # experimental/boxdd resolves <install>/sing-box.exe when it registers the
          # service and on every peer handshake. If a future branding change renames it,
          # this fails here instead of at service registration.
          grep -q '^  executableName: sing-box$' "$CLIENT_DIR/electron-builder.yml" || {
            echo "FAIL: win.executableName is not sing-box in the overlaid client" >&2; exit 1; }
          grep -q 'forceCodeSigning: signingConfiguration !== undefined' "$CLIENT_DIR/scripts/package.ts" || {
            echo "FAIL: package.ts does not require signing when a certificate is configured" >&2; exit 1; }
          echo "executable name and conditional forceCodeSigning are in place"

      - name: "[gate 2] install the client's dependencies"
        working-directory: ${{ env.CLIENT_DIR }}
        run: pnpm install --frozen-lockfile

      - name: "[gate 2] build the signed-test x64 NSIS installer"
        working-directory: ${{ env.CLIENT_DIR }}
        # Reuses the client's own pipeline: build_boxdd for the daemon, Cronet staging, the
        # WinDivert and USBIP drivers build_boxdd emits, windows_share.node via Cargo, the
        # staged PE machine check, electron-builder, and afterPack.cjs signing the daemon and
        # the native module with the certificate above. None of it is reimplemented here.
        run: pnpm run package:win x64

      - name: "[gate 2] report what was produced"
        shell: bash
        run: |
          set -euo pipefail
          echo "== installer =="
          ls -la "$CLIENT_DIR/release"/*.exe || true
          echo
          echo "== packaged application (selected) =="
          ls -la "$CLIENT_DIR/release/win-unpacked" | head -30
          echo
          echo "== packaged daemon, native module and drivers =="
          ls -la "$CLIENT_DIR/release/win-unpacked/resources/daemon" \
                 "$CLIENT_DIR/release/win-unpacked/resources/native" || true

      # --- GATE 3: static package validation --------------------------------
      - name: "[gate 3] verify the packaged application's integrity checks"
        shell: bash
        run: |
          set -euo pipefail
          # electron-builder runs the client's afterSign hook as part of its SIGNING step,
          # so it now runs for real; this also covers the case where it does not.
          node tooling/scripts/ci/verify-desktop-package-integrity.cjs \
            "$CLIENT_DIR" \
            "$CLIENT_DIR/release/win-unpacked" \
            sing-box

      - name: "[gate 3] verify the packaged daemon is the v0.1.5 core daemon"
        shell: bash
        run: |
          python tooling/scripts/ci/verify-desktop-daemon-provenance.py \
            "$CLIENT_DIR/release/win-unpacked/resources/daemon/sing-box-daemon.exe" \
            --core-dir core \
            --expect-core-sha "$CORE_SHA" \
            --expect-version "$CORE_VERSION" \
            --require-execution \
            --record "$RECORDS_DIR/daemon-provenance.txt"

      - name: "[gate 3] audit the architecture of everything in the package"
        shell: bash
        run: |
          set -euo pipefail
          # Every PE image must be amd64. The only non-amd64 images a correct build contains
          # are the two electron-builder ones named below, each by its exact path and each
          # with its reason. There is no wildcard: anything not listed fails.
          #
          #   Jiejiebox-...-windows-x64.exe  an NSIS installer is a 32-bit stub whatever it
          #                                  installs. It is the file the user runs, not
          #                                  shipped payload.
          #   resources/elevate.exe          electron-builder's NSIS UAC elevation helper,
          #                                  packed into the application by
          #                                  packElevateHelper. A legitimate 32-bit helper.
          python tooling/scripts/ci/audit-windows-pe-architecture.py \
            "$CLIENT_DIR/release/win-unpacked" \
            "$CLIENT_DIR/release/Jiejiebox-v$CORE_VERSION-windows-x64.exe" \
            --root "$CLIENT_DIR/release/win-unpacked" \
            --expect amd64 \
            --allow "Jiejiebox-v*-windows-x64.exe=i386 NSIS installer stub (electron-builder), not shipped payload" \
            --allow "resources/elevate.exe=i386 electron-builder NSIS UAC elevation helper" \
            --require "sing-box.exe" \
            --require "resources/daemon/sing-box-daemon.exe" \
            --require "resources/daemon/libcronet.dll" \
            --require "resources/daemon/WinDivert64.sys" \
            --require "resources/daemon/VBoxUSB.sys" \
            --require "resources/daemon/VBoxUSBMon.sys" \
            --require "resources/daemon/usbip2_ude.sys" \
            --require "resources/daemon/usbip2_filter.sys" \
            --require "resources/native/windows_share.node" \
            --record "$RECORDS_DIR/pe-architecture-audit.txt"

      - name: "[gate 3] audit the payload the installer actually carries"
        shell: bash
        env:
          PYTHON: python
        run: |
          bash tooling/scripts/ci/audit-windows-installer-payload.sh \
            "$CLIENT_DIR/release/Jiejiebox-v$CORE_VERSION-windows-x64.exe" \
            build/installer-payload
          # Only the audit record is kept: the extracted application is ~300 MB and is not
          # a build record. It is removed before any upload step can see it.
          cp build/installer-payload/installer-payload-audit.txt "$RECORDS_DIR/installer-payload-audit.txt"
          rm -rf build/installer-payload

      - name: "[gate 3] confirm the architecture audit recorded the expected x64 payload"
        shell: bash
        run: |
          set -euo pipefail
          # This step reports; it does not judge. The audit script is the single authority
          # on architecture and exits non-zero for any PE image that is neither amd64 nor a
          # declared exception, so reaching this step already means the policy held.
          #
          # Re-deriving the verdict here is how the two came to disagree: the record's rows
          # carry no leading indent, so a grep anchored with two spaces matched nothing at
          # all; and a grep for "i386" would have failed the very exceptions the audit had
          # just approved.
          for record in "$RECORDS_DIR/pe-architecture-audit.txt" \
                        "$RECORDS_DIR/installer-payload-audit.txt"; do
            [ -f "$record" ] || { echo "FAIL: $record is missing" >&2; exit 1; }
            amd64_count="$(grep -c '^amd64' "$record" || true)"
            [ "$amd64_count" -gt 0 ] || {
              echo "FAIL: $record records no amd64 PE image" >&2; exit 1; }
            echo "== $record =="
            grep -E '^(expected|pe images audited|non-pe files skipped|exemptions)' "$record" | sed 's/^/  /'
            echo "  amd64 rows: $amd64_count"
            echo
          done
          echo "the architecture audit passed for both the packaged tree and the payload"
          echo "extracted from the installer; the rows above are what it recorded."

      # --- GATE 4: signing --------------------------------------------------
      - name: "[gate 4] verify the Windows signing of the packaged binaries"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tooling/scripts/ci/windows/Test-WindowsSigning.ps1 `
            -ExpectedThumbprint $env:JJ_SIGNING_THUMBPRINT `
            -RecordPath "$env:RECORDS_DIR/signing-audit.txt" `
            -Files @(
              "$env:CLIENT_DIR/release/win-unpacked/sing-box.exe",
              "$env:CLIENT_DIR/release/win-unpacked/resources/daemon/sing-box-daemon.exe",
              "$env:CLIENT_DIR/release/win-unpacked/resources/native/windows_share.node"
            )

      # --- GATE 5: daemon service ------------------------------------------
      - name: "[gate 5] daemon service smoke test"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tooling/scripts/ci/windows/Test-DaemonService.ps1 `
            -DaemonPath "$env:CLIENT_DIR/release/win-unpacked/resources/daemon/sing-box-daemon.exe" `
            -WorkingDirectory $env:SERVICE_WORK_DIR `
            -RecordPath "$env:RECORDS_DIR/daemon-service-smoke-test.txt"

      - name: "[gate 5b] daemon secure service install (the installer's own path)"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The installer runs `service install` with NO relaxed-permission flag under
          # C:\Program Files, and aborts and rolls back when it fails. Gate 5 uses the CI
          # escape hatch; this gate does not, so it is the one that proves the path a real
          # installation takes - and it prints the daemon's stderr, which the installer
          # swallows.
          ./tooling/scripts/ci/windows/Test-SecureServiceInstall.ps1 `
            -PackagedDirectory "$env:CLIENT_DIR/release/win-unpacked" `
            -ProbeDirectory "C:\Program Files\sing-box-ci-probe" `
            -WorkingDirectory "C:\ProgramData\sing-box-daemon" `
            -RecordPath "$env:RECORDS_DIR/secure-service-install.txt"

      # --- GATE 6: installer lifecycle -------------------------------------
      - name: "[gate 6] NSIS install / reinstall / uninstall lifecycle"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          # The diagnostic path is under RUNNER_TEMP and deliberately has no spaces: the
          # installer parses it as a command-line option, and it must be outside $PLUGINSDIR
          # and $INSTDIR so it survives customInstall's rollback.
          ./tooling/scripts/ci/windows/Test-InstallerLifecycle.ps1 `
            -InstallerPath "$env:CLIENT_DIR/release/Jiejiebox-v$env:CORE_VERSION-windows-x64.exe" `
            -ExpectedVersion $env:CORE_VERSION `
            -RecordPath "$env:RECORDS_DIR/installer-lifecycle-smoke-test.txt" `
            -DiagnosticPath "$env:RUNNER_TEMP\jiejiebox-installer-diagnostic.txt"

      # --- GATE 7: driver packages -----------------------------------------
      - name: "[gate 7] driver package signature audit"
        shell: pwsh
        run: |
          $ErrorActionPreference = "Stop"
          ./tooling/scripts/ci/windows/Test-DriverSignatures.ps1 `
            -DriverDirectory "$env:CLIENT_DIR/release/win-unpacked/resources/daemon" `
            -RecordPath "$env:RECORDS_DIR/driver-signature-audit.txt"

      # --- GATE 8: records --------------------------------------------------
      - name: "[gate 8] record the build"
        shell: bash
        run: |
          set -euo pipefail
          installer="$CLIENT_DIR/release/Jiejiebox-v$CORE_VERSION-windows-x64.exe"
          {
            echo "Jiejiebox Windows installer build record"
            echo
            echo "core SHA          $CORE_SHA"
            echo "core version      $CORE_VERSION"
            echo "desktop client    $(git -C core rev-parse HEAD:clients/desktop)"
            echo "desktop HEAD      $(git -C "$CLIENT_DIR" rev-parse HEAD)"
            echo "tooling commit    $(git -C tooling rev-parse HEAD)"
            echo "daemon version    $CORE_VERSION"
            echo "daemon arch       windows/amd64"
            echo "signing           signed with a throwaway CI certificate (not a release identity)"
            echo "signed signer      $JJ_SIGNING_THUMBPRINT"
            echo "artifact          $(basename "$installer")"
            echo "artifact bytes    $(stat -c %s "$installer")"
            echo "artifact sha256   $(sha256sum "$installer" | cut -d' ' -f1)"
            echo
            cat "$RECORDS_DIR/daemon-provenance.txt"
            echo
            cat "$RECORDS_DIR/pe-architecture-audit.txt"
            echo
            cat "$RECORDS_DIR/installer-payload-audit.txt"
          } > "$RECORDS_DIR/BUILD-INFO-WINDOWS.txt"
          sha256sum "$installer" > "$RECORDS_DIR/SHA256SUMS-WINDOWS.txt"
          echo "== records to be uploaded =="
          ls -la "$RECORDS_DIR"
          echo
          cat "$RECORDS_DIR/BUILD-INFO-WINDOWS.txt"

      - name: "[gate 8] confirm the records are small and contain no signing material"
        shell: bash
        run: |
          set -euo pipefail
          # A build-record artifact that quietly carries the extracted application, the
          # checkout or a private key is worse than no artifact. This asserts the shape
          # rather than trusting the glob.
          total="$(du -sk "$RECORDS_DIR" | cut -f1)"
          echo "records size: ${total} KiB"
          [ "$total" -lt 4096 ] || {
            echo "FAIL: the records directory is ${total} KiB; it should be a few text files" >&2
            du -ah "$RECORDS_DIR" | sort -h | tail -10 >&2
            exit 1; }
          for forbidden in "*.pfx" "*.p12" "*.key" "*.pem" "signing.local.json" "*password*"; do
            found="$(find "$RECORDS_DIR" -name "$forbidden" -print -quit)"
            [ -z "$found" ] || { echo "FAIL: records contain $found" >&2; exit 1; }
          done
          echo "records contain $(find "$RECORDS_DIR" -type f | wc -l | tr -d ' ') text files and no signing material"

      - name: "[gate 8] upload the installer"
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-windows-x64-${{ env.CORE_VERSION }}-signed-test
          path: ${{ env.CLIENT_DIR }}/release/Jiejiebox-v${{ env.CORE_VERSION }}-windows-x64.exe
          if-no-files-found: error

      - name: "[gate 8] upload the build records"
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jiejiebox-windows-build-records
          path: ${{ env.RECORDS_DIR }}
          if-no-files-found: warn

      # --- cleanup ----------------------------------------------------------
      - name: "cleanup: remove the test signing material"
        if: always()
        shell: pwsh
        run: |
          ./tooling/scripts/ci/windows/Remove-TestSigningCertificate.ps1 `
            -ClientDirectory $env:CLIENT_DIR `
            -Thumbprint $env:JJ_SIGNING_THUMBPRINT

      - name: "cleanup: uninstall anything the gates left behind"
        if: always()
        shell: pwsh
        run: |
          # A failed gate can leave a service or an installation behind, and a leftover
          # service is exactly what would make the NEXT run's clean-state precondition fail.
          $ErrorActionPreference = "Continue"
          . (Join-Path $PWD "tooling/scripts/ci/windows/GateHelpers.ps1")
          $service = Get-Service -Name "sing-box-daemon" -ErrorAction SilentlyContinue
          if ($null -ne $service) {
            Write-Host "removing a leftover sing-box-daemon service"
            # Expected to be non-zero when the service is already gone; captured and
            # cleared so it cannot become this job's exit status.
            $deleted = Invoke-NativeCommand { sc.exe delete "sing-box-daemon" }
            Write-Host "  sc.exe delete exited $($deleted.ExitCode)"
          }
          # Identity comes from the shared resolver, not from a display name. The installation
          # directory and executable are "sing-box" while the product name is "Jiejiebox", so
          # matching on the name would be both wrong and unsafe: it would also match an entry
          # this test did not create.
          $state = Get-InstallationState
          if ($null -ne $state) {
            Write-Host "leftover installation: root=$($state.Root) layoutVersion=$($state.LayoutVersion)"
            $matches = @($state.UninstallMatches)
            if ($matches.Count -eq 1) {
              $uninstaller = Get-CommandExecutablePath ([string]$matches[0].Entry.UninstallString)
              if (Test-Path -LiteralPath $uninstaller) {
                Write-Host "running the discovered uninstaller $uninstaller"
                $process = Start-Process -FilePath $uninstaller -ArgumentList "/S", "/allusers" -PassThru
                $null = $process | Wait-Process -Timeout 600 -ErrorAction SilentlyContinue
              } else {
                Write-Host "::warning::the matched uninstall entry's uninstaller does not exist: $uninstaller"
              }
            } elseif ($matches.Count -gt 1) {
              Write-Host "::warning::$($matches.Count) uninstall entries match $($state.Root); removing none of them"
              foreach ($line in (Format-UninstallEntries -Entries $matches)) { Write-Host $line }
            } else {
              Write-Host "no uninstall entry matched $($state.Root); deleting only the service"
              $deleted = Invoke-NativeCommand { sc.exe delete "sing-box-daemon" }
              Write-Host "  sc.exe delete exited $($deleted.ExitCode)"
            }
          } else {
            Write-Host "no leftover installation was identifiable"
          }
          foreach ($leftover in @($env:SERVICE_WORK_DIR, "C:\Program Files\sing-box-ci-probe", "C:\ProgramData\sing-box-daemon")) {
            if (Test-Path -LiteralPath $leftover) {
              Write-Host "removing leftover $leftover"
              Remove-Item -LiteralPath $leftover -Recurse -Force -ErrorAction SilentlyContinue
            }
          }
          Write-Host "leftover cleanup finished"
          # This step is a safety net for FAILED runs, not a gate: the clean end state is
          # asserted by gate 6. Its exit code is its own decision, not the status of a
          # native command that was allowed to fail.
          Complete-Gate
