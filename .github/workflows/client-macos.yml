name: macOS arm64

# Builds and verifies THE macOS arm64 production core.
#
# # One product, one job, one build
#
# There is exactly ONE macOS core. It contains the NaiveProxy outbound (Cronet),
# the MASQUE transport, the full client protocol set, TUN, the native API and the
# Clash compatibility API, because those are the capabilities the product exists
# for. There is no lite/naive split, no darwin/amd64 build, and therefore no
# matrix: a matrix over profiles that are not products is just extra runner time.
#
# The binary is built EXACTLY ONCE. Version, architecture, tag agreement, runtime
# smoke, headless smoke, the product registry/capability audit, the LXD CLI probe,
# SHA-256, BUILD-INFO and the upload all read the same
# `dist/sing-box-darwin-arm64`. The previous design rebuilt the shipped core inside
# the package job, which meant the artifact was never the file that had been
# tested.
#
# # Quick path vs deep checks
#
# A push to `testing` runs the fast path above plus the core unit tests under the
# canonical tags.
#
# Behind the manual `deep_checks` input:
#
#   - go vet
#   - reproducibility
#   - race tests
#   - the fuzz campaign
#   - the Cronet engine A/B and the receive-window sweep, which need a live Naive
#     server and are therefore never runnable on a standard push
#
# # What is NOT here, and why
#
#   - the upstream-default (non-product) build. Neither shipped product is a stock
#     SagerNet build, and upstream breakage still surfaces through the real product
#     build and the unit tests.
#   - the `TestClient` registry assertions. `-run` filters what EXECUTES, not what
#     COMPILES, so the step paid ~25s to compile the whole `test/jiejie` integration
#     suite in order to run a few light registry assertions - and those same
#     properties are asserted against the SHIPPED binary by the product registry and
#     capability audit below, which is strictly stronger evidence. The test source is
#     untouched and still runs locally.
#   - a standalone `config check` step. The consolidated audit already runs
#     `check-macos-client-config.sh` against both the fixture and example-config.json,
#     so the real binary is still fully config-validated - once, not twice.
#   - a standalone `product capability verification` step. It ran a SECOND
#     `go tool nm` over the same binary for a mostly-overlapping assertion set. Its
#     unique assertions were merged into the audit script.
#
# No step here uses `continue-on-error`: every check on this workflow is a hard gate.
#
# # Triggers
#
# push to testing, plus manual dispatch. Documentation-only changes are ignored so
# a README edit does not rebuild a kernel. `paths-ignore` is used rather than a
# `paths` allowlist so a new source directory added later still triggers the build.

on:
  push:
    branches:
      - testing
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      deep_checks:
        description: Run expensive deep validation (vet, reproducibility, race, fuzz, Cronet A/B)
        required: false
        default: false
        type: boolean
      bench_server:
        description: Naive server host for the deep Cronet A/B (optional)
        required: false
        default: ''
        type: string

concurrency:
  group: macos-arm64-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  BINARY: dist/sing-box-darwin-arm64
  TAGS_FILE: release/BUILD_TAGS_JIEJIE_CLIENT_MACOS

jobs:
  macos-arm64:
    # Native macOS runner: a darwin binary cross-compiled on Linux cannot be
    # executed, so none of the runtime verification below would be possible, and
    # the Cronet/CGO profile is not reliably cross-compilable at all.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          # Only go.sum is listed. The reference and bench harnesses that use other
          # modules are deep checks and must not widen the cache key of the normal
          # fast path.
          cache-dependency-path: go.sum

      # -----------------------------------------------------------------------
      # Cheap static checks.
      # -----------------------------------------------------------------------
      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd include option protocol route service transport common dns adapter test/contract test/jiejie 2>&1 || true)"
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "PASS: gofmt clean"


      - name: unit tests (macOS tags)
        # An explicit package list rather than ./... , for the same reason as the
        # Linux workflow: experimental/libbox carries a pre-existing badlinkname
        # link failure under the tfogo_checklinkname0 tag this profile uses.
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -tags "$(cat "$TAGS_FILE")" -count=1 -timeout 25m \
            ./option ./transport/... ./protocol/... ./common/httpclient ./common/tls \
            ./include ./route ./adapter/... ./dns/... ./service/... ./experimental/clashapi
          echo "PASS: unit tests under the macOS tags"

      - name: build macOS core
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/ci/build-macos-client.sh arm64 "$BINARY"

      - name: architecture, version and tag agreement
        run: |
          set -euo pipefail
          VERSION="$(cat release/JIEJIE_VERSION)"

          ./"$BINARY" version
          file "$BINARY"

          # arm64 ONLY. `file` alone is not enough: a fat/universal binary also
          # reports arm64, so the arch list is checked explicitly.
          if ! file "$BINARY" | grep -q "arm64"; then
            echo "FAIL: the binary is not arm64" >&2
            exit 1
          fi
          if file "$BINARY" | grep -qi "universal\|x86_64"; then
            echo "FAIL: the binary contains a non-arm64 slice" >&2
            file "$BINARY" >&2
            exit 1
          fi
          lipo -archs "$BINARY" 2>/dev/null | tee /tmp/archs.txt || true
          if [ -s /tmp/archs.txt ] && ! grep -qx "arm64" /tmp/archs.txt; then
            echo "FAIL: expected exactly arm64, got: $(cat /tmp/archs.txt)" >&2
            exit 1
          fi
          ./"$BINARY" version | grep -F "darwin/arm64"

          # The binary must report the version and the tags its file declares.
          ./"$BINARY" version | grep -F "$VERSION"
          reported="$(./"$BINARY" version | sed -n 's/^Tags: //p')"
          expected="$(cat "$TAGS_FILE")"
          if [ "$reported" != "$expected" ]; then
            echo "FAIL: reported tags do not match the tag file" >&2
            echo "  reported: $reported" >&2
            echo "  expected: $expected" >&2
            exit 1
          fi
          # CGO must be ON: with_naive_outbound links the Cronet static library, and
          # a CGO-free build would silently have used the naive stub instead.
          ./"$BINARY" version | grep -F "CGO: enabled"
          echo "PASS: arm64, version, tags and CGO all agree with release/"


      - name: runtime smoke test (Clash API, process lifecycle)
        run: |
          set -euo pipefail
          ./scripts/ci/check-macos-client-runtime.sh "$BINARY" dist/runtime
          echo "PASS: runtime smoke"

      - name: headless smoke test (native Web API, no GUI)
        run: |
          set -euo pipefail
          ./scripts/ci/check-macos-client-headless.sh "$BINARY" dist/headless
          echo "PASS: headless smoke"

      - name: product registry and capability audit
        # ONE `go tool nm` over the SHIPPED binary, covering everything a name cannot
        # prove: excluded packages, included packages, the registry role split, the
        # Naive real-vs-stub distinction, the exact Cronet constructor, gVisor, the
        # MASQUE client/server split and the shared transport plane, Hysteria2, TUIC,
        # the Clash API, TUN and the LXD daemon package.
        #
        # It also runs `sing-box check` against the real client fixture and
        # example-config.json, which is where the standalone `config check` step used
        # to run. That validation is therefore still performed on the shipped binary -
        # once, inside the script, instead of twice.
        #
        # The former `product capability verification` step ran a SECOND `go tool nm`
        # over the same binary to assert a mostly-overlapping set. Its unique
        # assertions (exact `cronet-go.NewNaiveClient`, gVisor linkage, the LXD daemon
        # package) were merged into the script rather than dropped; the binary's symbol
        # table is now read once.
        run: |
          set -euo pipefail
          ./scripts/ci/audit-macos-client-registry.sh "$BINARY"
          echo "PASS: product registry and capability audit"


      - name: LXD daemon capability verification
        # The launcher decides whether a core supports daemon mode by running
        # `<core> lxd --help` and looking for --state-dir. This reproduces exactly that
        # probe against the SHIPPED binary, so a core whose lxd command is missing or
        # whose flags were renamed fails here rather than in the launcher UI.
        #
        # It also asserts the dependency graph, which is what proves the daemon is
        # REALLY linked rather than merely referenced: a `lxd` command that shelled out
        # to something else, or a stub, would not put the package in the graph.
        run: |
          set -euo pipefail

          # A. the command runs
          ./"$BINARY" lxd --help > /tmp/lxd-help.txt 2>&1 || {
            echo "FAIL: 'sing-box lxd --help' exited non-zero" >&2
            cat /tmp/lxd-help.txt >&2
            exit 1
          }
          echo "PASS: 'sing-box lxd --help' exits 0"

          # B. the launcher probe flag is present
          grep -qF -- "--state-dir" /tmp/lxd-help.txt || {
            echo "FAIL: 'lxd --help' does not advertise --state-dir, which is the flag" >&2
            echo "      the launcher greps for; it would report no daemon support" >&2
            exit 1
          }
          echo "PASS: --state-dir is advertised"

          # C. the service surface is present
          grep -qF -- "--service" /tmp/lxd-help.txt || {
            echo "FAIL: 'lxd --help' does not advertise --service" >&2
            exit 1
          }
          echo "PASS: --service is advertised"

          # D. no unknown-command failure
          if grep -qF "unknown command" /tmp/lxd-help.txt; then
            echo "FAIL: 'lxd --help' reports an unknown command" >&2
            cat /tmp/lxd-help.txt >&2
            exit 1
          fi
          echo "PASS: lxd is a real command, not an unknown one"

          # E. the client-management surface the installer drives
          ./"$BINARY" lxd client --help > /dev/null 2>&1 || {
            echo "FAIL: 'lxd client --help' exited non-zero" >&2; exit 1
          }
          ./"$BINARY" lxd client add --help > /dev/null 2>&1 || {
            echo "FAIL: 'lxd client add --help' exited non-zero" >&2; exit 1
          }
          echo "PASS: lxd client add/list/remove are reachable"

          # F. the dependency graph contains the daemon package
          TAGS="$(cat "$TAGS_FILE")"
          if ! CGO_ENABLED=1 go list -tags "$TAGS" -deps ./cmd/sing-box \
               | grep -qx 'github.com/sagernet/sing-box/lxd'; then
            echo "FAIL: github.com/sagernet/sing-box/lxd is not in the production" >&2
            echo "      dependency graph, so the daemon is not really linked" >&2
            exit 1
          fi
          echo "PASS: github.com/sagernet/sing-box/lxd is in the dependency graph"

      - name: write BUILD-INFO and SHA256
        run: |
          set -euo pipefail
          VERSION="$(cat release/JIEJIE_VERSION)"
          OUT="dist/Jiejie-macOS-arm64-${VERSION}-$(git rev-parse --short HEAD)"
          mkdir -p "$OUT"
          cp "$BINARY" "$OUT/sing-box-darwin-arm64"
          cp LICENSE "$OUT/LICENSE"
          ./scripts/ci/build-info.sh "$OUT/BUILD-INFO-MACOS.txt" darwin arm64 client-macos "$OUT/sing-box-darwin-arm64"
          # A standalone .sha256 beside the binary, so an operator can verify a
          # download without parsing a manifest.
          source scripts/ci/lib.sh
          ( cd "$OUT" && printf '%s  %s\n' "$(sha256_of sing-box-darwin-arm64)" sing-box-darwin-arm64 > sing-box-darwin-arm64.sha256 )
          echo "ARTIFACT_DIR=$OUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$(basename "$OUT")" >> "$GITHUB_ENV"
          ls -la "$OUT"
          cat "$OUT/sing-box-darwin-arm64.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
          # The payload is a binary that is already close to incompressible, and
          # the macOS core is the larger of the two, so a low level keeps the
          # upload fast instead of chasing a few percent.
          compression-level: 1

      - name: summary
        run: |
          set -euo pipefail
          {
            echo "### macOS arm64"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| platform | darwin |"
            echo "| arch | arm64 |"
            echo "| version | \`$(cat release/JIEJIE_VERSION)\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| build tags | \`$(cat "$TAGS_FILE")\` |"
            echo "| cgo | enabled |"
            echo "| binary bytes | $(stat -f '%z' "$BINARY") |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$ARTIFACT_DIR/sing-box-darwin-arm64.sha256")\` |"
            echo "| artifact | \`$ARTIFACT_NAME\` |"
            echo "| deep_checks | ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # =======================================================================
      # Deep checks: manual dispatch with deep_checks=true only.
      # =======================================================================
      - name: deep check - go vet
        # A FOCUSED package set rather than ./... , for the same reason as the
        # Linux workflow: ./... pulls in two upstream files with pre-existing
        # unsafe.Pointer vet warnings that this fork does not modify.
        # Moved off the fast path: measured 69s on every push, where gofmt, the unit
        # tests and the real product build already exercise the same code. The package
        # list is UNCHANGED - nothing was widened to `./...`. It is a HARD gate, with
        # no continue-on-error.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go vet -tags "$(cat "$TAGS_FILE")" \
            ./option ./transport/... ./protocol/... ./common/httpclient ./common/tls \
            ./include ./route ./adapter/... ./dns/... ./service/...
          echo "PASS: go vet clean under the macOS tags"

      - name: deep check - reproducibility
        # Moved off the fast path, matching Linux, which has always run it here: it
        # costs a second full build and answers a release-audit question rather than a
        # per-commit one. NOT deleted - the check itself is unchanged.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          ./scripts/ci/build-macos-client.sh arm64 dist/repro-check >/dev/null
          source scripts/ci/lib.sh
          first="$(sha256_of "$BINARY")"
          second="$(sha256_of dist/repro-check)"
          if [ "$first" != "$second" ]; then
            echo "FAIL: not reproducible" >&2
            echo "  first:  $first" >&2
            echo "  second: $second" >&2
            exit 1
          fi
          echo "PASS: reproducible ($first)"

      # -----------------------------------------------------------------------
      # Package: the artifact holds what was verified, and nothing else.
      # -----------------------------------------------------------------------

      - name: deep check - race tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          CGO_ENABLED=1 go test -race -tags "$(cat "$TAGS_FILE")" -count=1 -timeout 40m \
            ./transport/masque/ ./transport/http/ ./protocol/naive/ ./route/ ./common/httpclient/
          echo "PASS: race tests"

      - name: deep check - fuzz campaign
        # Every target is the same set as before; only the BUDGET changed, from 20s to
        # 5s each, matching Linux. 20s per target is long-run fuzzing, not a CI
        # regression smoke: CI establishes that the corpus still loads, the parser does
        # not immediately crash, and no obvious panic regression is present. The
        # accumulated corpus in testdata is replayed either way.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat "$TAGS_FILE")"
          run_fuzz() {
            echo "--- fuzzing $2 in $1 for ${3}s"
            go test -tags "$TAGS" -run '^$' -fuzz "^$2\$" -fuzztime "$3" "$1"
          }
          run_fuzz ./transport/masque FuzzCapsuleParser 5s
          run_fuzz ./transport/masque FuzzMasqueIPPacketParser 5s
          run_fuzz ./transport/http FuzzConnectUDPTargetPath 5s
          run_fuzz ./protocol/naive FuzzNaiveConnectAuthority 5s
          run_fuzz ./protocol/naive FuzzNaivePaddingFrame 5s
          echo "PASS: fuzz campaign"


      - name: deep check - Cronet engine A/B
        # Needs a live Naive server on a real path: the two engine layouts differ
        # in how many independent HTTP/2 sessions they carry, which a loopback
        # cannot distinguish. Skips with NOT TESTED when no server is supplied
        # rather than producing meaningless numbers.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks && inputs.bench_server != '' }}
        env:
          NAIVE_USER: ${{ secrets.NAIVE_BENCH_USER }}
          NAIVE_PASS: ${{ secrets.NAIVE_BENCH_PASS }}
        run: |
          set -euo pipefail
          ./scripts/ci/bench-naive-cronet-engine.sh "${{ inputs.bench_server }}" 443
          echo "PASS: Cronet engine A/B completed"

      - name: deep check - Naive receive-window sweep
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks && inputs.bench_server != '' }}
        env:
          NAIVE_USER: ${{ secrets.NAIVE_BENCH_USER }}
          NAIVE_PASS: ${{ secrets.NAIVE_BENCH_PASS }}
        run: |
          set -euo pipefail
          ./scripts/ci/bench-naive-receive-window.sh "${{ inputs.bench_server }}" 443
          echo "PASS: receive-window sweep completed"
