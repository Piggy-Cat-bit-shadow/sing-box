name: Fork Linux amd64

on:
  workflow_dispatch:
  push:
    branches:
      - testing
      - feat/**

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-go@v5
        with:
          go-version: ~1.25
          cache: true
      - name: Build
        shell: bash
        run: |
          set -euo pipefail
          # The full default set includes a prebuilt Cronet archive intended for
          # the release toolchain. This portable Linux build uses upstream's
          # non-Cronet tag set, which still includes with_quic.
          TAGS=$(cat release/DEFAULT_BUILD_TAGS_OTHERS)
          go build -trimpath -tags "$TAGS" -ldflags "-X github.com/sagernet/sing-box/constant.Version=1.15.0-jiejie-masquerade.2" -o sing-box-linux-amd64 ./cmd/sing-box
          sha256sum sing-box-linux-amd64 > sing-box-linux-amd64.sha256
      - uses: actions/upload-artifact@v4
        with:
          name: sing-box-linux-amd64
          path: |
            sing-box-linux-amd64
            sing-box-linux-amd64.sha256
