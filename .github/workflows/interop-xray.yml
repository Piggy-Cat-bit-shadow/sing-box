name: Reference interop (Xray)

# The reference-interop stand for REALITY key_share, VLESS application-layer
# encryption, XHTTP and Vision.
#
# # Why this is workflow_dispatch only
#
# The stand needs a real Xray-core binary; nothing here stubs it. That makes the
# workflow useless without network access to the release download and impossible
# to satisfy in a sandbox, so it is manual on purpose: a push should not fail
# because GitHub's release CDN was briefly unavailable, and a green tick that
# never actually started a reference process would be worse than no workflow at
# all.
#
# # Why the reference is a MATRIX of pinned tags and not `latest`
#
# REALITY's two key_share policies are accepted by disjoint version ranges: a
# hybrid-stripped greeting is only accepted below v26.9.8, and the hybrid share is
# only accepted at or above it. One binary therefore cannot cover the scenario
# matrix, and `latest` - which the GitHub releases API resolves to the newest
# NON-prerelease release - silently picks one side: at the time of writing it is
# below v26.9.8, so five of the ten scenarios skipped on every run and the hybrid,
# encryption, Vision and XHTTP halves of the debt were never exercised at all.
#
# The default is now the two tags that cover both sides, and the job runs once per
# tag. `latest` is still accepted as an entry for an operator who wants to know
# what the newest release does; it is just not the default, because "the newest
# release" is not a statement about which side of the split the stand needs.
#
# v26.9.30 is a prerelease: the hybrid requirement landed on the prerelease line,
# and the newest non-prerelease release is below the threshold. A release tag is a
# tag; the download step does not care which line it is on.
#
# # What it does and does not prove
#
# It proves or falsifies the wire format against each reference in the matrix, for
# the scenarios that reference accepts. The remaining scenario SKIPs in a leg are
# the version gate working, not a gap: `reality-classical` skips on the hybrid
# leg and the hybrid scenarios skip on the classical leg, and each leg's artifact
# list records which one ran.
#
# The default (non-live) half of the stand runs in the `Verify` workflow on every
# push; this one adds the reference.

on:
  workflow_dispatch:
    inputs:
      xray_versions:
        description: >-
          JSON array of Xray-core release tags to run the matrix against, e.g.
          ["v26.9.30", "v26.3.27"]. An entry may be `latest` to resolve the
          newest non-prerelease release. The default covers BOTH sides of the
          REALITY key_share split, which no single binary can.
        required: false
        default: '["v26.9.30", "v26.3.27"]'
      run_filter:
        description: 'Go test -run filter (default: the whole live matrix).'
        required: false
        default: TestLiveInterop

permissions:
  contents: read

jobs:
  interop:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    strategy:
      # One leg failing must not cancel the others: the two legs answer different
      # questions, and losing the second answer because the first found a bug is
      # exactly how half a matrix rots.
      fail-fast: false
      matrix:
        xray_version: ${{ fromJSON(inputs.xray_versions) }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: default (non-live) half of the stand
        # Runs first and unconditionally: if the generator or the gate is broken,
        # there is no point downloading a reference to find out.
        run: |
          set -euo pipefail
          # DEFAULT_BUILD_TAGS_OTHERS, not DEFAULT_BUILD_TAGS: this stand tests protocol WIRE
          # interop - VLESS, REALITY, the encryption layer, XHTTP, Vision - and Cronet is not one of
          # its scenarios. DEFAULT_BUILD_TAGS carries with_naive_outbound, which drags the prebuilt
          # libcronet.a into the test binary, and the linux_amd64 archive is incompatible with this
          # runner's linker:
          #     ld: skipping incompatible .../lib/linux_amd64@.../libcronet.a
          #     ld: cannot find -l:libcronet.a
          # so the stand could not even LINK, let alone run a scenario - which is how a transport
          # implementation detail blocked the reference-interop debt from being paid. The OTHERS set is
          # the desktop set without naive, it changes no scenario this stand executes, and the
          # capability gates below still read the real tag set.
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          cd test
          go test -count=1 -tags "$TAGS" -v ./interop/

      - name: resolve the reference version
        id: reference
        env:
          REQUESTED: ${{ matrix.xray_version }}
        run: |
          set -euo pipefail
          requested="$REQUESTED"
          if [ "$requested" = "latest" ]; then
            # Fetch to a FILE, then parse the file. Not `curl ... | grep -m1 ...`.
            #
            # `grep -m1` exits as soon as it matches, which closes the pipe while curl is still
            # writing; curl reports "curl: (23) Failure writing output to destination", and under
            # `set -o pipefail` that write error becomes the pipeline's exit status, so the step
            # fails even though the tag was read correctly. The same early-exit-versus-pipefail
            # interaction broke the Android NDK install in this sweep.
            #
            # Parsing a complete file has no such coupling: a reader that stops early cannot make
            # the fetch look like a failure.
            #
            # Authenticated: the unauthenticated GitHub API allows 60 requests per hour PER IP, and
            # hosted runners share IPs, so this step failed with
            #     curl: (22) The requested URL returned error: 403
            # from rate limiting rather than from anything about Xray. The run's own token raises the
            # limit enough that the failure stops being a coin flip, and reading a public release is
            # within the read-only permission this workflow already declares.
            #
            # Note that the API's `latest` is the newest NON-prerelease release. That is exactly why
            # it is not the matrix default; see the header.
            curl -fsSL -o /tmp/xray-release.json \
              -H "Authorization: Bearer ${{ github.token }}" \
              -H "Accept: application/vnd.github+json" \
              https://api.github.com/repos/XTLS/Xray-core/releases/latest
            if [ ! -s /tmp/xray-release.json ]; then
              echo "::error::the GitHub releases API returned nothing for XTLS/Xray-core" >&2
              exit 1
            fi
            requested="$(sed -n 's/.*"tag_name": *"\([^"]*\)".*/\1/p' /tmp/xray-release.json | head -1)"
          fi
          if [ -z "$requested" ]; then
            echo "::error::could not resolve an Xray-core release tag" >&2
            exit 1
          fi
          echo "version=$requested" >> "$GITHUB_OUTPUT"
          echo "resolved Xray-core $requested"

      - name: download the reference binary
        run: |
          set -euo pipefail
          version="${{ steps.reference.outputs.version }}"
          mkdir -p "$RUNNER_TEMP/xray"
          curl -fsSL -o "$RUNNER_TEMP/xray.zip" \
            "https://github.com/XTLS/Xray-core/releases/download/${version}/Xray-linux-64.zip"
          unzip -o -q "$RUNNER_TEMP/xray.zip" -d "$RUNNER_TEMP/xray"
          chmod +x "$RUNNER_TEMP/xray/xray"
          "$RUNNER_TEMP/xray/xray" version

      - name: live reference interop
        # The two halves of the gate are both set here. The build tag is what this
        # workflow exists to exercise; the environment variable keeps the live
        # path from ever running because a build happened to include the tag.
        env:
          XRAY_BINARY: ${{ runner.temp }}/xray/xray
          RUN_LIVE_XRAY_INTEROP: '1'
          INTEROP_KEEP_ARTIFACTS: '1'
        run: |
          set -euo pipefail
          # DEFAULT_BUILD_TAGS_OTHERS, not DEFAULT_BUILD_TAGS: this stand tests protocol WIRE
          # interop - VLESS, REALITY, the encryption layer, XHTTP, Vision - and Cronet is not one of
          # its scenarios. DEFAULT_BUILD_TAGS carries with_naive_outbound, which drags the prebuilt
          # libcronet.a into the test binary, and the linux_amd64 archive is incompatible with this
          # runner's linker:
          #     ld: skipping incompatible .../lib/linux_amd64@.../libcronet.a
          #     ld: cannot find -l:libcronet.a
          # so the stand could not even LINK, let alone run a scenario - which is how a transport
          # implementation detail blocked the reference-interop debt from being paid. The OTHERS set is
          # the desktop set without naive, it changes no scenario this stand executes, and the
          # capability gates below still read the real tag set.
          TAGS="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          cd test
          go test -count=1 -timeout 30m -v \
            -tags "$TAGS,liveinterop" \
            -run "${{ inputs.run_filter }}" \
            ./interop/ 2>&1 | tee "$RUNNER_TEMP/interop.log" || {
              tail -200 "$RUNNER_TEMP/interop.log" >&2
              exit 1
            }
          # A -run filter that matches nothing passes vacuously. The stand's whole
          # purpose is to not do that, so an empty run is a failure here.
          ran="$(grep -cE '^--- (PASS|FAIL|SKIP):' "$RUNNER_TEMP/interop.log" || true)"
          if [ "$ran" -eq 0 ]; then
            echo "::error::the interop matrix matched no tests; the -run filter is stale" >&2
            exit 1
          fi
          # A leg that only SKIPPED is the failure mode this workflow was in: `latest`
          # resolved to the side of the key_share split that skipped half the matrix,
          # and the run reported green for a leg that had proved nothing. Every leg
          # exists to cover the other's skips, so every leg must pass something.
          passed="$(grep -cE '^--- PASS:' "$RUNNER_TEMP/interop.log" || true)"
          if [ "$passed" -eq 0 ]; then
            echo "::error::this reference passed no scenario; a leg that only skips proves nothing" >&2
            exit 1
          fi
          echo "reference interop (${{ steps.reference.outputs.version }}) reported $ran test results, $passed passed"

      - name: collect the generated configs and both sides' logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          # Per-leg: both legs upload in the same run, and a shared name would make
          # one overwrite the other.
          name: interop-artifacts-${{ steps.reference.outputs.version }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            /tmp/sing-box-interop-*
            ${{ runner.temp }}/interop.log
