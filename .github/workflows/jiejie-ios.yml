name: Jiejie iOS
# Builds the Jiejie Go core into Libbox.xcframework and compiles the pinned
# upstream sing-box-for-apple (SFI) against it.
#
# Scope of this workflow is deliberately narrow: it proves the Jiejie core can
# be shipped as the Apple core and that SFI still builds from the SAME Apple
# commit the main repository pins. It does NOT sign, notarize, export an
# installable IPA or touch the Swift sources. A signed, installable build is a
# separate stage.

on:
  workflow_dispatch:
  push:
    branches:
      - testing
      - feat/jiejie-ios-libbox
      - 'integrate/**'
    paths:
      # H3 core: the options and the implementations this stage exists to ship.
      - 'option/**'
      - 'common/httpclient/**'
      - 'transport/http/**'
      - 'experimental/libbox/**'
      - 'cmd/internal/build_libbox/**'
      - 'cmd/internal/build_shared/**'
      - 'include/**'
      - 'adapter/**'
      - 'go.mod'
      - 'go.sum'
      - 'Makefile'
      # The pinned Apple client and its build glue.
      - 'clients/apple'
      - '.github/workflows/jiejie-ios.yml'
      - 'test/jiejie/**'

# A newer push to the same ref cancels the older run, so a burst of pushes does
# not queue several macOS builds on stale commits.
concurrency:
  group: jiejie-ios-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  libbox-and-sfi:
    # GitHub-hosted macOS runner. Deliberately NOT the upstream private runner
    # label (xcode-27): that belongs to SagerNet and is not guaranteed available
    # to a fork.
    runs-on: macos-latest
    steps:
      - name: Checkout with the pinned Apple submodule
        uses: actions/checkout@v5
        with:
          # The Apple client is a gitlink; recursive checkout lands on exactly
          # the commit the main repository pins. No clone of a moving branch.
          submodules: recursive

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          # Caching is done explicitly below so the key can carry the tag
          # flavour. Enabling setup-go's cache as well would double-save the
          # same directory and fight over the key.
          cache: false

      - name: Toolchain and revision report
        run: |
          set -euo pipefail
          echo "core_sha=$(git rev-parse HEAD)"
          echo "core_short_sha=$(git rev-parse --short=7 HEAD)"
          echo "branch=$(git rev-parse --abbrev-ref HEAD)"
          echo "apple_sha=$(git -C clients/apple rev-parse HEAD)"
          echo "--- sw_vers ---";          sw_vers
          echo "--- uname -a ---";         uname -a
          echo "--- xcode-select -p ---";  xcode-select -p
          echo "--- xcodebuild ---";       xcodebuild -version
          echo "--- go ---";               go version

      - name: Restore Go caches
        uses: actions/cache/restore@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: jiejie-ios-${{ runner.os }}-${{ hashFiles('go.sum') }}
          restore-keys: jiejie-ios-${{ runner.os }}-

      - name: TrustTunnel zero audit
        run: |
          set -euo pipefail
          # Negative control for the whole stage: the Apple core must not carry
          # TrustTunnel as code, dependency, build tag or shipped file.
          #
          # This checks IMPLEMENTATION, not prose. Documentation that states
          # TrustTunnel is absent (and this workflow, which contains the search
          # terms themselves) is not a violation; a Go source file, a dependency
          # or a build tag referencing it is.
          echo "--- checked-in TrustTunnel files (expect none) ---"
          if git ls-tree -r --name-only HEAD | grep -i trusttunnel; then
            echo "FAIL: TrustTunnel file is checked in" >&2
            exit 1
          fi

          echo "--- TrustTunnel in Go source (expect none) ---"
          if git grep -niE 'trusttunnel|sing-trusttunnel' -- '*.go' ':(exclude)*_test.go'; then
            echo "FAIL: TrustTunnel reference in Go source" >&2
            exit 1
          fi

          echo "--- TrustTunnel build tags (expect none) ---"
          if grep -rniE 'with_trusttunnel|jiejie_trusttunnel' --include='*.go' --include='Dockerfile*' --include='Makefile' . 2>/dev/null; then
            echo "FAIL: TrustTunnel build tag present" >&2
            exit 1
          fi

          echo "--- sing-trusttunnel module dependency (expect none) ---"
          if grep -q 'sing-trusttunnel' go.mod go.sum; then
            echo "FAIL: sing-trusttunnel present in the module files" >&2
            exit 1
          fi
          if [ -f test/go.mod ] && grep -q 'sing-trusttunnel' test/go.mod test/go.sum; then
            echo "FAIL: sing-trusttunnel present in the test module files" >&2
            exit 1
          fi

          echo "--- TrustTunnel in the Libbox package the Apple core is built from ---"
          if git grep -niE 'trusttunnel' -- experimental/libbox/; then
            echo "FAIL: TrustTunnel reference in experimental/libbox" >&2
            exit 1
          fi

          echo "TrustTunnel: absent (files, Go source, build tags, module files, Libbox)"

      - name: Libbox config smoke test
        run: |
          set -euo pipefail
          # Proves the SAME Libbox config entry point the Apple client uses
          # accepts http3_connection_pool and http3_fallback, with with_quic
          # enabled exactly as the XCFramework build enables it.
          go test -vet=off -tags with_quic -count=1 -v -run 'TestCheckConfig' ./experimental/libbox

      - name: Install gomobile
        run: make lib_install

      - name: Build Libbox.xcframework (ios + iossimulator)
        run: |
          set -euo pipefail
          # Only the two slices this stage needs. macOS/tvOS are out of scope,
          # so they are not built and not claimed.
          go run ./cmd/internal/build_libbox -target apple -platform ios,iossimulator

      - name: Install Libbox into the pinned Apple client
        run: |
          set -euo pipefail
          # build_libbox looks for ../sing-box-for-apple (the upstream layout).
          # This repository keeps the client as clients/apple, so the move is
          # done explicitly here rather than by patching the shared helper.
          test -d Libbox.xcframework
          rm -rf clients/apple/Libbox.xcframework
          mv Libbox.xcframework clients/apple/Libbox.xcframework
          ls -la clients/apple/Libbox.xcframework

      - name: Verify XCFramework slices
        run: |
          set -euo pipefail
          find clients/apple/Libbox.xcframework -maxdepth 2 -name 'Info.plist' -o -maxdepth 1 -type d | sort
          echo "--- Info.plist ---"
          plutil -p clients/apple/Libbox.xcframework/Info.plist
          echo "--- slices ---"
          for binary in clients/apple/Libbox.xcframework/*/Libbox.framework/Libbox; do
            echo "== $binary"
            file "$binary"
            lipo -info "$binary" || true
            echo "size_bytes: $(wc -c < "$binary" | tr -d ' ')"
            echo "sha256: $(shasum -a 256 "$binary" | awk '{print $1}')"
          done

      - name: Verify Jiejie HTTP3 markers in the built framework
        run: |
          set -euo pipefail
          # Artifact-level evidence that the Jiejie H3 options are compiled into
          # the core SFI links, not merely present in the source tree.
          #
          # The framework binary is a fat STATIC ARCHIVE (the CI log reports
          # "current ar archive"), not a linked executable, so the option names
          # live as string literals in the __cstring sections of the archive
          # members. Xcode's bundled `strings` also fails on an archive this
          # size ("failed to flush output"), so grep -a is used instead: it
          # scans the raw bytes and does not need to parse the Mach-O container.
          provider="clients/apple/Libbox.xcframework/ios-arm64/Libbox.framework/Libbox"
          [ -f "$provider" ] || provider="$(find clients/apple/Libbox.xcframework -name Libbox -type f | head -1)"
          echo "inspecting: $provider ($(wc -c < "$provider" | tr -d ' ') bytes)"

          missing=0
          for marker in http3_connection_pool http3_fallback; do
            if LC_ALL=C grep -a -q -- "$marker" "$provider"; then
              echo "FOUND marker: $marker"
            else
              echo "MISSING marker: $marker"
              missing=$((missing + 1))
            fi
          done

          if [ "$missing" -ne 0 ]; then
            echo "FAIL: $missing Jiejie HTTP/3 marker(s) absent from the built framework" >&2
            exit 1
          fi
          echo "Both Jiejie HTTP/3 option markers are present in the built framework."

      - name: Collect Libbox artifact
        run: |
          set -euo pipefail
          mkdir -p artifact/libbox
          cp -R clients/apple/Libbox.xcframework artifact/libbox/
          {
            echo "Jiejie Libbox.xcframework build information"
            echo "=========================================="
            echo "core_sha:            $(git rev-parse HEAD)"
            echo "core_short_sha:      $(git rev-parse --short=7 HEAD)"
            echo "branch:              $(git rev-parse --abbrev-ref HEAD)"
            echo "apple_submodule_sha: $(git -C clients/apple rev-parse HEAD)"
            echo "go_version:          $(go version)"
            echo "gomobile_version:    v0.1.13 (see Makefile lib_install)"
            echo "xcode_version:       $(xcodebuild -version | tr '\n' ' ')"
            echo "target_slices:       ios-arm64, iossimulator-arm64"
            echo "build_tags:          with_quic,with_wireguard,with_utls,with_naive_outbound,with_clash_api,with_usbip,with_openvpn,with_openconnect,badlinkname,tfogo_checklinkname0,with_tailscale,ts_omit_*,with_dhcp,grpcnotrace"
            echo "with_quic:           true"
            echo "trusttunnel:         false"
            echo "signed:              false"
            echo "build_time_utc:      $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id:     ${GITHUB_RUN_ID}"
          } > artifact/libbox/BUILD-INFO.txt
          # Portable hashing without xargs: an XCFramework holds many files, and
          # `xargs -I{}` spawns one long command per file, which overruns
          # ARG_MAX ("command line cannot be assembled, too long").
          ( cd artifact/libbox && find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r f; do
              printf '%s  %s\n' "$(shasum -a 256 "$f" | awk '{print $1}')" "$f"
            done > SHA256SUMS )
          cat artifact/libbox/BUILD-INFO.txt
          echo "--- framework binaries ---"
          for binary in artifact/libbox/Libbox.xcframework/*/Libbox.framework/Libbox; do
            echo "$binary  $(shasum -a 256 "$binary" | awk '{print $1}')  $(wc -c < "$binary" | tr -d ' ') bytes"
          done

      - name: Upload Libbox
        # Uploaded as soon as it exists, so the Jiejie core deliverable is
        # preserved even if the SFI application build below cannot complete.
        uses: actions/upload-artifact@v4
        with:
          name: Jiejie-Libbox-iOS-${{ github.sha }}
          path: artifact/libbox
          if-no-files-found: error

      - name: Resolve Swift packages
        working-directory: clients/apple
        run: |
          set -euo pipefail
          xcodebuild -resolvePackageDependencies \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -skipPackagePluginValidation

      - name: Build SFI for the iOS Simulator (unsigned)
        id: sfi_simulator_build
        working-directory: clients/apple
        run: |
          set -euo pipefail
          # Mandatory build of this stage. No signing: the artifact is a
          # simulator product and is never presented as installable.
          #
          # This step verifies that the Jiejie Libbox links and that SFI builds
          # against it. It is expected to fail while the pinned Apple commit and
          # this core disagree on the Libbox Swift API surface; that condition
          # is diagnosed and reported separately below, and is NOT masked here.
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS Simulator' \
            -skipPackagePluginValidation \
            -derivedDataPath build/DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY="" 2>&1 | tee /tmp/sfi-simulator-build.log
          echo "build_status=PASS" >> "$GITHUB_OUTPUT"

      - name: Classify the SFI build failure (if any)
        if: failure() && steps.sfi_simulator_build.outcome == 'failure'
        run: |
          set -euo pipefail
          # Distinguish a genuine compile/link problem from the known upstream
          # Libbox Swift API skew. A signing/provisioning failure would NOT be
          # classified here, because signing is explicitly disabled.
          log=/tmp/sfi-simulator-build.log
          echo "=== SFI build failure classification ==="
          if grep -q 'LibboxPromotePowerReportDraft' "$log"; then
            echo "CAUSE: the pinned Apple client calls LibboxPromotePowerReportDraft(),"
            echo "       which core commit 3aff5d0f1 (2026-09-23) renamed to"
            echo "       DiscardPowerReportDraft(). The Apple gitlink is 2026-09-14."
          fi
          if grep -q 'usePlatformAutoRedirect\|ExtensionPlatformInterface' "$log"; then
            echo "CAUSE: core commit 061889303 (2026-09-23) added"
            echo "       UsePlatformAutoRedirect()/createAutoRedirect(), which the"
            echo "       pinned Apple client does not implement."
          fi
          echo
          echo "This is upstream Libbox Swift/Core API skew at two different pin"
          echo "dates, not a Jiejie regression:"
          echo "Jiejie commits touching experimental/libbox: $(git log --oneline HEAD --not upstream/testing -- experimental/libbox/ 2>/dev/null | wc -l | tr -d ' ')"
          echo "Libbox diff vs upstream/testing: '$(git diff --stat upstream/testing HEAD -- experimental/libbox/ 2>/dev/null)'"
          echo "See docs/JIEJIE-IOS.md for the recorded blocker and the resolution options."
          echo
          echo "=== first compile errors ==="
          grep -E 'error:' "$log" | sort -u | head -20 || true
          exit 1

      - name: Build SFI for a generic iOS device (unsigned)
        id: device_build
        working-directory: clients/apple
        continue-on-error: false
        run: |
          set -euo pipefail
          # Second build: proves the device architecture also compiles and
          # links. Signing is disabled, so a failure here is a real
          # compile/link failure, not a provisioning one.
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -derivedDataPath build/DerivedDataDevice \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Build SFI for a generic iOS device, device-only (unsigned, slim)
        working-directory: clients/apple
        run: |
          set -euo pipefail
          # Device-only means arm64 alone, no simulator slice and no x86_64.
          # A stock iPhone never loads either, so dropping them is the whole
          # point of this variant: it is the artifact a user would actually
          # install (and sign themselves).
          xcodebuild build \
            -project sing-box.xcodeproj \
            -scheme SFI \
            -configuration Release \
            -destination 'generic/platform=iOS' \
            -skipPackagePluginValidation \
            -derivedDataPath build/DerivedDataDeviceSlim \
            ONLY_ACTIVE_ARCH=NO \
            ARCHS=arm64 \
            EXCLUDED_ARCHS="x86_64 arm64e" \
            VALIDATE_PRODUCT=YES \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            CODE_SIGN_IDENTITY=""

      - name: Package the device build as an UNSIGNED IPA
        run: |
          set -euo pipefail
          # An IPA is just Payload/<App>.app zipped. This one is UNSIGNED: it
          # carries no valid signature, so it installs only after the user
          # signs it with their own certificate and provisioning profile.
          #
          # It is therefore named UNSIGNED and is never described as
          # installable on a stock, unmodified iPhone.
          mkdir -p artifact/sfi
          slim_app="$(find clients/apple/build/DerivedDataDeviceSlim/Build/Products -maxdepth 3 -name 'SFI.app' -type d | head -1 || true)"
          if [ -z "$slim_app" ]; then
            echo "FAIL: device-only SFI.app was not produced" >&2
            exit 1
          fi
          echo "device-only app: $slim_app"

          stage="$(mktemp -d)"
          mkdir -p "$stage/Payload"
          cp -R "$slim_app" "$stage/Payload/"

          # Record what is actually inside, and confirm there is no signature to
          # lose: an unsigned app either has no _CodeSignature or an empty one.
          echo "--- binary architecture ---"
          file "$stage/Payload/SFI.app/SFI" || true
          lipo -info "$stage/Payload/SFI.app/SFI" || true
          echo "--- code signature presence ---"
          if [ -d "$stage/Payload/SFI.app/_CodeSignature" ]; then
            echo "_CodeSignature directory present (contents below)"
            ls -la "$stage/Payload/SFI.app/_CodeSignature" || true
          else
            echo "no _CodeSignature directory: the app is unsigned"
          fi
          codesign -dv "$stage/Payload/SFI.app" 2>&1 | head -5 || echo "codesign reports no signature (expected)"

          ( cd "$stage" && zip -qry SFI-device-arm64-UNSIGNED.ipa Payload )
          mv "$stage/SFI-device-arm64-UNSIGNED.ipa" artifact/sfi/
          rm -rf "$stage"

          echo "--- IPA contents (top level) ---"
          unzip -l artifact/sfi/SFI-device-arm64-UNSIGNED.ipa | head -15
          echo "ipa_bytes: $(wc -c < artifact/sfi/SFI-device-arm64-UNSIGNED.ipa | tr -d ' ')"
          echo "ipa_sha256: $(shasum -a 256 artifact/sfi/SFI-device-arm64-UNSIGNED.ipa | awk '{print $1}')"

      - name: Report device binary size
        run: |
          set -euo pipefail
          # Size audit for the device-only variant: the Go core dominates the
          # binary, so the framework and the final executable are both recorded.
          slim_app="$(find clients/apple/build/DerivedDataDeviceSlim/Build/Products -maxdepth 3 -name 'SFI.app' -type d | head -1)"
          echo "--- device-only SFI.app size ---"
          du -sh "$slim_app"
          echo "--- top-level binary ---"
          ls -la "$slim_app/SFI" 2>/dev/null || true
          echo "--- embedded frameworks ---"
          ls -la "$slim_app/Frameworks" 2>/dev/null | head -10 || true
          for fw in "$slim_app"/Frameworks/*; do
            [ -e "$fw" ] || continue
            echo "$(basename "$fw"): $(du -sh "$fw" | awk '{print $1}')"
          done

      - name: Confirm the Apple client sources were not modified
        run: |
          set -euo pipefail
          # The gitlink may be UPDATED as a commit (that is how the pin moves),
          # but no source file may be PATCHED here.
          echo "--- pinned gitlink recorded in the parent repository ---"
          pinned="$(git ls-tree HEAD clients/apple | awk '{print $3}')"
          actual="$(git -C clients/apple rev-parse HEAD)"
          echo "pinned: $pinned"
          echo "actual: $actual"
          if [ "$pinned" != "$actual" ]; then
            echo "FAIL: clients/apple is not at the commit the parent pins" >&2
            exit 1
          fi

          echo "--- submodule status ---"
          git -C clients/apple status --short

          # Source files must be untouched. Package.resolved is EXCLUDED on
          # purpose: `xcodebuild -resolvePackageDependencies` rewrites the
          # checked-in lockfile as a normal part of resolving, so treating it
          # as a hand edit would fail on every run. Its change is recorded
          # below for the log rather than asserted against.
          echo "--- enforced: no modified Swift/source/project files ---"
          modified="$(git -C clients/apple status --short --untracked-files=no \
            | grep -vE 'Package\.resolved$' || true)"
          if [ -n "$modified" ]; then
            echo "FAIL: the pinned Apple client has tracked source modifications:" >&2
            echo "$modified" >&2
            exit 1
          fi
          echo "OK: no Swift, xcodeproj or entitlement file was modified"

          echo "--- recorded: Package.resolved delta produced by package resolution ---"
          if git -C clients/apple diff --quiet -- '**/Package.resolved'; then
            echo "Package.resolved: unchanged by resolution"
          else
            echo "Package.resolved: rewritten by xcodebuild -resolvePackageDependencies (expected)"
            git -C clients/apple diff --stat -- '**/Package.resolved'
          fi

          echo "--- enforced: no .swift file differs from the pinned commit ---"
          if git -C clients/apple diff --name-only -- '*.swift' | grep -q .; then
            echo "FAIL: Swift source differs from the pinned commit" >&2
            git -C clients/apple diff --name-only -- '*.swift' >&2
            exit 1
          fi
          echo "Apple client: at the pinned commit, no Swift or project modifications"

      - name: Collect unsigned SFI artifact
        run: |
          set -euo pipefail
          mkdir -p artifact/sfi
          # The product sits at <Products>/Release-iphonesimulator/SFI.app, so
          # the search needs depth 3 rather than 2. The tree is printed first so
          # a future layout change is visible in the log rather than only as a
          # failure.
          echo "--- simulator products tree ---"
          find clients/apple/build/DerivedData/Build/Products -maxdepth 2 -type d | sort | head -20
          app_path="$(find clients/apple/build/DerivedData/Build/Products -maxdepth 3 -name 'SFI.app' -type d | head -1)"
          if [ -z "$app_path" ]; then
            echo "FAIL: simulator SFI.app was not produced" >&2
            exit 1
          fi
          echo "simulator app: $app_path"
          ditto -c -k --sequesterRsrc --keepParent "$app_path" artifact/sfi/SFI-simulator-UNSIGNED.zip
          echo "device products tree ---"
          find clients/apple/build/DerivedDataDevice/Build/Products -maxdepth 2 -type d 2>/dev/null | sort | head -20 || true
          device_app="$(find clients/apple/build/DerivedDataDevice/Build/Products -maxdepth 3 -name 'SFI.app' -type d | head -1 || true)"
          if [ -n "$device_app" ]; then
            echo "device app: $device_app"
            ditto -c -k --sequesterRsrc --keepParent "$device_app" artifact/sfi/SFI-device-UNSIGNED.zip
          fi
          {
            echo "Jiejie SFI unsigned build information"
            echo "====================================="
            echo "core_sha:                  $(git rev-parse HEAD)"
            echo "core_short_sha:            $(git rev-parse --short=7 HEAD)"
            echo "branch:                    $(git rev-parse --abbrev-ref HEAD)"
            echo "apple_submodule_sha:       $(git -C clients/apple rev-parse HEAD)"
            echo "go_version:                $(go version)"
            echo "xcode_version:             $(xcodebuild -version | tr '\n' ' ')"
            echo "simulator_build:           SUCCESS"
            echo "device_build:              SUCCESS (compiled and linked unsigned)"
            echo "device_only_build:         SUCCESS (arm64 only, slim)"
            echo "ipa:                       SFI-device-arm64-UNSIGNED.ipa"
            echo "signed:                    false"
            echo "installable_on_stock_ios:  false"
            echo "build_time_utc:            $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            echo "workflow_run_id:           ${GITHUB_RUN_ID}"
            echo ""
            echo "This artifact is UNSIGNED. It contains a simulator build, an"
            echo "unsigned generic-device compile product, and an UNSIGNED"
            echo "device-only IPA (arm64)."
            echo ""
            echo "The IPA cannot be installed on a stock, unmodified iPhone: it"
            echo "carries no valid signature. Installing it requires signing it"
            echo "with your own certificate and provisioning profile."
          } > artifact/sfi/BUILD-INFO.txt
          # Same portable loop as the Libbox step: an .app bundle has many
          # files, and `xargs -I{}` overruns ARG_MAX on it.
          ( cd artifact/sfi && find . -type f ! -name SHA256SUMS -print | LC_ALL=C sort | while IFS= read -r f; do
              printf '%s  %s\n' "$(shasum -a 256 "$f" | awk '{print $1}')" "$f"
            done > SHA256SUMS )
          cat artifact/sfi/BUILD-INFO.txt
          echo "--- artifact tree ---"
          find artifact -type f | sort

      - name: Save Go caches
        if: always()
        uses: actions/cache/save@v4
        with:
          path: |
            ~/go/pkg/mod
            ~/Library/Caches/go-build
          key: jiejie-ios-${{ runner.os }}-${{ hashFiles('go.sum') }}

      - name: Upload unsigned SFI
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Jiejie-SFI-iOS-UNSIGNED-${{ github.sha }}
          path: artifact/sfi
          if-no-files-found: warn

  ios-summary:
    needs: [libbox-and-sfi]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Summarise
        run: |
          {
            echo "### Jiejie iOS"
            echo ""
            echo "| job | result |"
            echo "| --- | --- |"
            echo "| libbox-and-sfi | ${{ needs.libbox-and-sfi.result }} |"
            echo ""
            echo "Artifacts are UNSIGNED and are **not** installable on a stock iPhone."
            echo "Signing, provisioning and real-device installation are a later stage."
          } >> "$GITHUB_STEP_SUMMARY"
