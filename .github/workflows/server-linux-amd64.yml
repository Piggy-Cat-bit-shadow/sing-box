name: Linux amd64

# Builds and verifies THE Linux amd64 server core.
#
# # What this workflow is for
#
# One job, one build, one artifact: `sing-box-linux-amd64`. A push to `testing` must
# mean "build the Linux kernel", not "run a protocol laboratory for a quarter of an
# hour and build a kernel at the end of it".
#
# # The fast path, and why it looks like this
#
# The previous revision ran the whole `test/jiejie` package on every push. Measured
# on run 36306308538, that single step was **776s** of a ~16 minute job - roughly
# 80% of the wall clock - while everything it actually gated (build, config,
# runtime, audit, upload) totalled under 90s. It is an integration, conformance and
# reference suite, not a unit test suite, and it does not belong on every commit.
#
# The fast path now runs only what gates the artifact:
#
#   gofmt
#   focused production unit tests   (same principle)
#   9 PRODUCTION-CONTRACT tests     - registry + topology fixture, 0.47s, in their
#                                     own package so only they are compiled
#   build ONCE
#   version and tags
#   production topology config check
#   runtime smoke
#   package-graph pruning audit     (`go list -deps`, no build)
#   runtime registry pruning audit  (the shipped binary rejects pruned types)
#   size ceiling
#   SHA-256 and BUILD-INFO
#   upload
#
# # The fast path performs EXACTLY ONE `go build`
#
# This claim was false before and is enforced now:
#
#   - the `.debug` second build for the symbol audit is GONE. Pruning is checked
#     against the compile-time package graph (`go list -deps`), which needs no build
#     at all and is in fact a stronger statement: it proves the package is not in
#     the program, not merely that its symbols were not observed.
#   - reproducibility moved to deep_checks, so the `repro-check` rebuild is gone.
#
# Both `go build` invocations that remain in this file are inside deep-check steps.
#
# # Deep checks
#
# Everything expensive sits behind `workflow_dispatch` with `deep_checks=true`:
# go vet, reproducibility, race tests, the fuzz campaign, the reference suite
# (`test/jiejie/reference` plus the Caddy/forwardproxy differential) and the MASQUE
# reference interop. Slow is fine there; it is a manual full audit.
#
# # What is NOT here, and why
#
#   - the full `test/jiejie` integration suite. It ran 12m35s, and its result carried
#     almost no information: the four Naive UoT audits fail by design, the step was
#     `continue-on-error`, and `set -euo pipefail` combined with `go test ...;
#     status=$?` meant the shell exited at the failure before the known/unexpected
#     classifier could ever run. Its source is untouched and still runs locally; only
#     the automatic CI execution is gone.
#   - the upstream-default compatibility build. This fork ships two products, neither
#     of which is a stock SagerNet build. Upstream breakage still surfaces through the
#     real product builds, the unit tests and the merge itself.
#
# Every remaining deep check is a HARD gate: there is no `continue-on-error` in this
# file.
#
# # Triggers
#
# push to testing, plus manual dispatch. Documentation-only changes are ignored.
# `paths-ignore` is used rather than a `paths` allowlist so a new source directory
# still triggers a build.

on:
  push:
    branches:
      - testing
    paths-ignore:
      - 'docs/**'
      - '**/*.md'
      - 'LICENSE'
      - '.gitignore'
      - '.editorconfig'
  workflow_dispatch:
    inputs:
      deep_checks:
        description: Run expensive deep validation (vet, race, fuzz, reproducibility, reference suite, MASQUE interop)
        required: false
        default: false
        type: boolean

# `group` includes the MODE as well as the ref. Without the mode, a manual
# `deep_checks=true` dispatch shares a group with the push run for the same ref and
# CANCELS it: dispatching a deep audit right after a push silently kills the very
# fast run the push existed to produce. MEASURED - that cancelled runs 36343441291
# and 36343441290 while their deep counterparts proceeded.
#
# With the mode in the key, the two coexist, and supersession still works where it
# is wanted: a newer push still cancels an older push, and a newer deep dispatch
# still cancels an older deep dispatch.
concurrency:
  group: linux-amd64-${{ github.ref }}-${{ inputs.deep_checks && 'deep' || 'fast' }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  # Raw ELF size ceiling. The current production binary is about 33.9 MB; this
  # leaves room for normal Go and dependency growth while still catching an
  # accidental regression, such as a protocol or service that should have been
  # pruned finding its way back into the registry.
  MAX_BINARY_BYTES: 48000000
  BINARY: dist/sing-box-linux-amd64

jobs:
  linux-amd64:
    runs-on: ubuntu-latest
    # The FAST path finishes in ~2.5 minutes, so this ceiling exists for the
    # deep_checks path, which is genuinely long: the full jiejie suite is ~13 minutes
    # on its own, and the race and fuzz legs add several more.
    #
    # 120 minutes gives that room while still bounding a hung run. The ceiling was
    # raised from 45 after a run was CANCELLED mid-flight at 45.4 minutes, which is
    # worse than a failure: it looks like a flake and hides the fact that every
    # preceding deep check had passed.
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd include option protocol route service transport common dns adapter test/contract 2>&1 || true)"
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "PASS: gofmt clean"

      - name: unit tests (production tags)
        # Focused for the same reason as vet: every listed package is one the
        # server compiles, plus the ones this fork actually modifies. transport/http
        # and protocol/naive are the two heaviest, and both are in the data path of
        # the protocols this server serves.
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          go test -tags "$TAGS" -count=1 -timeout 10m \
            ./option ./transport/http ./protocol/http ./protocol/naive \
            ./protocol/anytls ./protocol/shadowtls ./protocol/shadowsocks \
            ./common/httpclient ./common/tls ./include ./route
          echo "PASS: focused unit tests under $TAGS"

      - name: production contract tests (registry + topology)
        # The nine contract assertions that decide whether the shipped binary can
        # serve the production topology at all:
        #
        #   - every inbound, outbound and DNS transport type the production fixture
        #     names is resolvable through the shipped registry;
        #   - the fixture is internally consistent (no dangling references, the
        #     modelled topology matches, no secrets, the Naive flow-control windows
        #     are the ones intended).
        #
        # They are pure in-memory assertions over include.*Registry and the fixture
        # JSON: no listener, no socket, no process.
        #
        # # Why they live in their own package
        #
        # These tests used to sit in `test/jiejie` behind a `-run` filter. `-run`
        # selects what EXECUTES; it does not stop the package's `_test.go` files from
        # COMPILING. So the fast path paid for compiling the whole integration suite
        # (Naive differential, HCL/UoT, H3, ACL, MASQUE, resource, lifecycle) to run
        # nine in-memory assertions: 0.47s of test for a ~20s step.
        #
        # They now live in `test/contract/serverminimal`, a package containing nothing
        # but these contracts, so the step compiles what it runs. The tests were MOVED,
        # not copied - there is one definition of each, and `git log --follow` traces
        # them. No assertion was dropped: the set was enumerated with
        # `go test -list` before and after the move and is identical.
        #
        # Everything else in test/jiejie is integration/conformance/reference work
        # (packet-impairment campaigns, NAT rebinding, resource profiling, Caddy
        # parity, long-lived connection leak checks) and runs in the deep_checks leg
        # below.
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          cd test
          go test -tags "$TAGS" -count=1 -timeout 5m -v ./contract/serverminimal/
          echo "PASS: production registry and topology contract tests"

      # -----------------------------------------------------------------------
      # THE build. This is the only `go build` on the fast path.
      # -----------------------------------------------------------------------
      - name: build production binary
        run: |
          set -euo pipefail
          mkdir -p dist
          ./scripts/ci/build-server.sh linux amd64 "$BINARY"

      - name: version and tag agreement
        run: |
          set -euo pipefail
          VERSION="$(cat release/JIEJIE_VERSION)"

          ./"$BINARY" version
          file "$BINARY"

          # The binary must report the version and the tags its files declare. A
          # tag-file edit the build ignored would otherwise go unnoticed, which is
          # exactly how a missing registry tag once survived a green build.
          ./"$BINARY" version | grep -F "$VERSION"
          reported="$(./"$BINARY" version | sed -n 's/^Tags: //p')"
          expected="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          if [ "$reported" != "$expected" ]; then
            echo "FAIL: reported tags do not match the tag file" >&2
            echo "  reported: $reported" >&2
            echo "  expected: $expected" >&2
            exit 1
          fi
          # The production server must not carry component tags it does not use.
          ! ./"$BINARY" version | grep -F "with_tailscale"
          ! ./"$BINARY" version | grep -F "with_openvpn"
          ! ./"$BINARY" version | grep -F "with_naive_outbound"
          echo "PASS: version and tags agree with release/"

      - name: config check
        # Checks the REAL production topology, which is the config this server
        # exists to run. If a registry trim removed something the topology needs,
        # this fails here rather than on the VPS.
        #
        # It deliberately does NOT check release/config/config.json: that is the
        # upstream stock example, and Server Minimal correctly rejects it
        # ("unknown transport type: tls") because the trim removes DNS transports
        # this topology does not use.
        run: |
          set -euo pipefail
          topology="release/jiejie-production-topology.json"
          [ -f "$topology" ] || { echo "FAIL: $topology is missing" >&2; exit 1; }

          # The topology references TLS material at /tmp/jiejie-fixture, and `check`
          # LOADS the certificates rather than only parsing the paths, so they must
          # exist. A throwaway self-signed pair is enough: the assertion is that
          # every type the topology names resolves and its TLS settings are well
          # formed, not that the certificates are the production ones.
          mkdir -p /tmp/jiejie-fixture
          openssl req -x509 -newkey rsa:2048 -nodes -days 1 \
            -keyout /tmp/jiejie-fixture/key.pem \
            -out /tmp/jiejie-fixture/cert.pem \
            -subj "/CN=example.test" \
            -addext "subjectAltName=DNS:example.test,DNS:localhost,IP:127.0.0.1" \
            2>/dev/null

          echo "checking $topology"
          ./"$BINARY" check -c "$topology"
          echo "PASS: the production topology validates against the shipped registry"

      - name: runtime smoke test
        # Starts the real binary and talks to it over a real socket. A config check
        # proves the configuration parses; this proves the process runs, binds its
        # listener, accepts a connection and shuts down cleanly.
        #
        # There is deliberately NO API readiness probe: Server Minimal registers no
        # service at all - no Clash API, no native API - because the production
        # topology uses none. Readiness is observed the way an operator would
        # observe it: the listener accepts.
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"
          cat > "$workdir/smoke.json" <<'JSON'
          {
            "log": {"level": "info"},
            "inbounds": [
              {
                "type": "shadowsocks", "tag": "smoke-in",
                "listen": "127.0.0.1", "listen_port": 19301,
                "method": "2022-blake3-aes-128-gcm",
                "password": "AAAAAAAAAAAAAAAAAAAAAA==",
                "network": "tcp"
              }
            ],
            "outbounds": [{"type": "direct", "tag": "direct"}],
            "route": {"final": "direct"}
          }
          JSON

          ./"$BINARY" run -c "$workdir/smoke.json" > "$workdir/smoke.log" 2>&1 &
          pid=$!
          trap 'kill $pid 2>/dev/null || true' EXIT

          ready=""
          for _ in $(seq 1 100); do
            if python3 -c "
          import socket,sys
          try:
              socket.create_connection(('127.0.0.1',19301),timeout=1).close()
          except Exception:
              sys.exit(1)
          " 2>/dev/null; then ready=1; break; fi
            if ! kill -0 $pid 2>/dev/null; then
              echo "FAIL: the process exited before its listener came up" >&2
              cat "$workdir/smoke.log" >&2
              exit 1
            fi
            sleep 0.2
          done
          [ -n "$ready" ] || {
            echo "FAIL: the inbound listener never accepted a connection" >&2
            cat "$workdir/smoke.log" >&2
            exit 1
          }
          echo "PASS: the process is up and its inbound accepted a TCP connection"

          kill -TERM $pid
          wait $pid || true
          if grep -qiE "panic|FATAL" "$workdir/smoke.log"; then
            echo "FAIL: panic or fatal error in the log" >&2
            cat "$workdir/smoke.log" >&2
            exit 1
          fi
          if ! grep -q "sing-box started" "$workdir/smoke.log"; then
            echo "FAIL: the log does not show a successful start" >&2
            cat "$workdir/smoke.log" >&2
            exit 1
          fi
          echo "PASS: started cleanly and shut down on SIGTERM with no panic"

      - name: dependency pruning audit (compile-time package graph)
        # Answers "is this package in the program" using the compiler's own view,
        # with NO build step. `go list -deps` resolves the import graph for the
        # production tags in under a second, and it is a STRONGER check than reading
        # a symbol table: a package absent from the graph is definitively not
        # compiled in, whereas a missing symbol could in principle be inlining,
        # dead-code elimination or a stripped table.
        #
        # This replaces an earlier revision that linked a second, unstripped
        # `*.debug` binary purely to run `go tool nm`.
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          go list -deps -tags "$TAGS" ./cmd/sing-box > /tmp/deps.txt
          echo "package graph: $(wc -l < /tmp/deps.txt) packages"
          failed=0

          # Must NOT be in the graph. Full import paths, not loose substrings.
          pruned=(
            "github.com/sagernet/sing-box/protocol/hysteria"
            "github.com/sagernet/sing-box/protocol/hysteria2"
            "github.com/sagernet/sing-box/protocol/tuic"
            "github.com/sagernet/sing-box/protocol/vless"
            "github.com/sagernet/sing-box/protocol/vmess"
            "github.com/sagernet/sing-box/protocol/trojan"
            "github.com/sagernet/sing-box/protocol/tor"
            "github.com/sagernet/sing-box/protocol/ssh"
            "github.com/sagernet/sing-box/protocol/snell"
            "github.com/sagernet/sing-box/protocol/bridge"
            "github.com/sagernet/sing-box/protocol/mixed"
            "github.com/sagernet/sing-box/protocol/redirect"
            "github.com/sagernet/sing-box/protocol/tun"
            "github.com/sagernet/sing-box/protocol/masque"
            "github.com/sagernet/sing-box/transport/masque"
            "github.com/sagernet/sing-box/service/resolved"
            "github.com/sagernet/sing-box/service/origin_ca"
            "github.com/sagernet/sing-box/service/ssmapi"
            "github.com/sagernet/sing-box/service/api"
            "github.com/sagernet/sing-box/dns/transport/quic"
            "github.com/sagernet/sing-box/tailscale"
            "github.com/caddyserver/certmagic"
          )
          for pkg in "${pruned[@]}"; do
            if grep -qxF "$pkg" /tmp/deps.txt; then
              echo "FAIL: $pkg is in the production package graph" >&2
              failed=1
            else
              echo "PASS: $pkg pruned"
            fi
          done

          # MUST be in the graph, or the topology this server exists to serve is
          # not actually servable. Without this half, the check above would pass on
          # a build that compiled nothing at all.
          required=(
            "github.com/sagernet/sing-box/protocol/http"
            "github.com/sagernet/sing-box/protocol/anytls"
            "github.com/sagernet/sing-box/protocol/shadowtls"
            "github.com/sagernet/sing-box/protocol/shadowsocks"
            "github.com/sagernet/sing-box/transport/http"
            # Native Naive is REQUIRED: the live production configuration declares
            # a `naive` inbound, and a build without this package rejects that config
            # with `unknown inbound type: naive`. It was previously listed as pruned on
            # the mistaken belief that Caddy forwardproxy@udpintcp had replaced it; see
            # AUD-P2-002. Only the inbound is needed - the Naive OUTBOUND carries its own
            # `with_naive_outbound` tag, which this profile does not set, so cronet stays
            # out of the graph.
            "github.com/sagernet/sing-box/protocol/naive"
          )
          for pkg in "${required[@]}"; do
            if grep -qxF "$pkg" /tmp/deps.txt; then
              echo "PASS: $pkg linked"
            else
              echo "FAIL: $pkg is MISSING; the production topology cannot be served" >&2
              failed=1
            fi
          done

          [ "$failed" -eq 0 ] || exit 1
          echo "AUDIT: PASS"

      - name: registry pruning audit (runtime, against the shipped binary)
        # The package graph proves what was COMPILED. This proves what the shipped
        # binary will actually ACCEPT, which is a different question: the registry
        # could resolve a type whose package is present but unregistered, and the
        # config loader is what an operator experiences.
        #
        # Both directions, so neither can be satisfied by rejecting everything.
        run: |
          set -euo pipefail
          workdir="$(mktemp -d)"

          # A pruned inbound must be REJECTED.
          cat > "$workdir/pruned.json" <<'JSON'
          {"log": {"level": "error"},
           "inbounds": [{"type": "tun", "tag": "t", "interface_name": "tun0"}]}
          JSON
          if ./"$BINARY" check -c "$workdir/pruned.json" >/dev/null 2>&1; then
            echo "FAIL: the pruned 'tun' inbound was accepted; the trim is not real" >&2
            exit 1
          fi
          echo "PASS: a pruned inbound type is rejected by the shipped binary"

          # A pruned OUTBOUND must be rejected too, since the production registry
          # registers only direct and socks.
          cat > "$workdir/pruned-out.json" <<'JSON'
          {"log": {"level": "error"},
           "outbounds": [{"type": "vmess", "tag": "v", "server": "127.0.0.1", "server_port": 1, "uuid": "00000000-0000-0000-0000-000000000000"}]}
          JSON
          if ./"$BINARY" check -c "$workdir/pruned-out.json" >/dev/null 2>&1; then
            echo "FAIL: the pruned 'vmess' outbound was accepted" >&2
            exit 1
          fi
          echo "PASS: a pruned outbound type is rejected by the shipped binary"

          # And the transports the topology uses must be ACCEPTED, so the checks
          # above cannot pass by the registry rejecting everything.
          cat > "$workdir/present.json" <<'JSON'
          {"log": {"level": "error"},
           "outbounds": [{"type": "direct", "tag": "direct"}]}
          JSON
          if ! ./"$BINARY" check -c "$workdir/present.json" >/dev/null 2>&1; then
            echo "FAIL: the 'direct' outbound the topology uses was rejected" >&2
            exit 1
          fi
          echo "PASS: the direct outbound is accepted"

      - name: size ceiling
        run: |
          set -euo pipefail
          SIZE=$(stat -c '%s' "$BINARY")
          echo "raw bytes: $SIZE"
          echo "ceiling:   $MAX_BINARY_BYTES"
          ls -lh "$BINARY"
          if [ "$SIZE" -gt "$MAX_BINARY_BYTES" ]; then
            echo "FAIL: production binary size regression" >&2
            echo "A protocol or service that should have been pruned has most likely" >&2
            echo "found its way back into the registry." >&2
            exit 1
          fi
          echo "PASS: $SIZE <= $MAX_BINARY_BYTES bytes"

      # -----------------------------------------------------------------------
      # Package: the artifact holds what was verified, and nothing else.
      # -----------------------------------------------------------------------
      - name: write BUILD-INFO and SHA256
        run: |
          set -euo pipefail
          VERSION="$(cat release/JIEJIE_VERSION)"
          OUT="dist/Jiejie-Linux-amd64-${VERSION}-$(git rev-parse --short HEAD)"
          mkdir -p "$OUT"
          cp "$BINARY" "$OUT/sing-box-linux-amd64"
          cp LICENSE "$OUT/LICENSE"
          ./scripts/ci/build-info.sh "$OUT/BUILD-INFO-LINUX.txt" linux amd64 server-minimal "$OUT/sing-box-linux-amd64"
          # A standalone .sha256 beside the binary, so an operator can verify a
          # download without parsing a manifest.
          source scripts/ci/lib.sh
          ( cd "$OUT" && printf '%s  %s\n' "$(sha256_of sing-box-linux-amd64)" sing-box-linux-amd64 > sing-box-linux-amd64.sha256 )
          echo "ARTIFACT_DIR=$OUT" >> "$GITHUB_ENV"
          echo "ARTIFACT_NAME=$(basename "$OUT")" >> "$GITHUB_ENV"
          ls -la "$OUT"
          cat "$OUT/sing-box-linux-amd64.sha256"

      - name: upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: ${{ env.ARTIFACT_NAME }}
          path: ${{ env.ARTIFACT_DIR }}
          if-no-files-found: error
          retention-days: 14
          # The payload is a binary that is already close to incompressible, so a
          # low level keeps the upload fast instead of chasing a few percent.
          compression-level: 1

      - name: summary
        run: |
          set -euo pipefail
          {
            echo "### Linux amd64"
            echo ""
            echo "| field | value |"
            echo "|---|---|"
            echo "| platform | linux |"
            echo "| arch | amd64 |"
            echo "| version | \`$(cat release/JIEJIE_VERSION)\` |"
            echo "| commit | \`${{ github.sha }}\` |"
            echo "| build tags | \`$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)\` |"
            echo "| binary bytes | $(stat -c '%s' "$BINARY") |"
            echo "| sha256 | \`$(cut -d' ' -f1 "$ARTIFACT_DIR/sing-box-linux-amd64.sha256")\` |"
            echo "| artifact | \`$ARTIFACT_NAME\` |"
            echo "| deep_checks | ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks || 'false' }} |"
          } >> "$GITHUB_STEP_SUMMARY"

      # =======================================================================
      # Deep checks: manual dispatch with deep_checks=true only.
      # =======================================================================

      - name: deep check - go vet
        # The package list is IDENTICAL to what the fast path used; nothing was
        # widened to `./...`. It is the set of first-party packages this server's own
        # dependency graph actually reaches, derived from `go list -deps` rather than
        # from a wildcard.
        #
        # `./option` is included because the option schema is part of the shipped
        # contract. daemon/ and experimental/libbox are excluded deliberately: both
        # carry pre-existing upstream vet warnings this fork does not modify, and
        # neither is in the server's graph.
        #
        # It moved here rather than being deleted because it is a real static-analysis
        # gate but a poor use of every push: measured 47s on the fast path, where the
        # remaining checks (gofmt, unit tests, the contract package, the real product
        # build) already exercise the same code. It is a HARD gate: no
        # continue-on-error.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          go vet -tags "$TAGS" \
            ./option ./include ./route ./adapter/... \
            ./protocol/direct ./protocol/dns ./protocol/group ./protocol/anytls \
            ./protocol/http ./protocol/naive ./protocol/shadowsocks \
            ./protocol/shadowtls ./protocol/socks \
            ./transport/http ./transport/v2ray ./transport/v2rayhttp \
            ./transport/v2raygrpclite ./transport/v2rayhttpupgrade \
            ./transport/v2raywebsocket ./transport/simple-obfs ./transport/sip003 \
            ./dns/... ./common/httpclient ./common/tls ./common/listener
          echo "PASS: go vet clean under the production tags"

      - name: deep check - reproducibility
        # Was on the fast path, where it meant compiling the whole program a second
        # time on every commit to compare hashes. That is a release-audit question,
        # not a per-commit one.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          ./scripts/ci/build-server.sh linux amd64 dist/repro-check >/dev/null
          source scripts/ci/lib.sh
          first="$(sha256_of "$BINARY")"
          second="$(sha256_of dist/repro-check)"
          if [ "$first" != "$second" ]; then
            echo "FAIL: not reproducible" >&2
            echo "  first:  $first" >&2
            echo "  second: $second" >&2
            exit 1
          fi
          echo "PASS: reproducible ($first)"

      - name: deep check - race tests
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          go test -race -tags "$TAGS" -count=1 -timeout 40m \
            ./transport/masque/ ./transport/http/ ./protocol/naive/ ./route/ ./common/httpclient/
          echo "PASS: race tests"

      - name: deep check - fuzz campaign
        # Bounded campaigns over the MASQUE, HTTP and Naive parsers. These seed the
        # corpus and catch parser regressions, which is why they are worth running
        # - just not on every commit.
        #
        # Every target is the same set as before; only the BUDGET changed, from 20s
        # to 5s each. 20s per target is long-run fuzzing, not a CI regression smoke:
        # what CI needs to establish is that the corpus still loads, the parser does
        # not immediately crash, and no obvious panic regression is present. The
        # corpus each target has accumulated is preserved in testdata, so a shorter
        # run still replays every previously-found case. Measured effect: 198s -> ~50s.
        #
        # Longer fuzzing belongs in a dedicated local or scheduled job, not here.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          run_fuzz() {
            echo "--- fuzzing $2 in $1 for ${3}s"
            go test -tags "$TAGS" -run '^$' -fuzz "^$2\$" -fuzztime "$3" "$1"
          }
          run_fuzz ./transport/masque FuzzCapsuleParser 5s
          run_fuzz ./transport/masque FuzzRouteAdvertisement 5s
          run_fuzz ./transport/masque FuzzConnectIPAddresses 5s
          run_fuzz ./transport/masque FuzzConnectIPTemplatePath 5s
          run_fuzz ./transport/masque FuzzMasqueIPPacketParser 5s
          run_fuzz ./transport/masque FuzzCapsuleStreamFragmentation 5s
          run_fuzz ./transport/http FuzzConnectUDPTargetPath 5s
          echo "PASS: fuzz campaign"


      - name: deep check - reference suite (module + differential)
        # Runs the `test/jiejie/reference` module - the external-reference interop suite,
        # pinned against quic-go/masque-go and quic-go/connect-ip-go - and diffs this fork
        # against the pinned Caddy/forwardproxy reference. Far too heavy for a standard
        # push, and valuable before a protocol release.
        #
        # It also runs the reference module itself, and then the coverage check over that
        # run. The reference tests live in their OWN Go module (`test/jiejie/reference`)
        # and do NOT appear in the jiejie package's log, so a coverage check pointed at
        # the jiejie log would fail on every test and a check pointed at nothing would
        # pass vacuously. It is pointed at the reference module, whose tests it exists to
        # verify.
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"

          # The reference module needs a binary built from the reference tag set, and it
          # reads its path from JIEJIE_SING_BOX_BINARY.
          go build -tags "$TAGS" -o /tmp/sing-box-reference ./cmd/sing-box
          (
            cd test/jiejie/reference
            JIEJIE_SING_BOX_BINARY=/tmp/sing-box-reference \
              go test -tags "$TAGS" -count=1 -timeout 30m -v . \
              > /tmp/reference-module.log 2>&1 || {
                tail -80 /tmp/reference-module.log >&2
                exit 1
              }
          )
          ran="$(grep -cE '^--- (PASS|FAIL|SKIP):' /tmp/reference-module.log || true)"
          if [ "$ran" -eq 0 ]; then
            echo "::error::the reference module reported no tests; it was not actually run" >&2
            exit 1
          fi
          tail -5 /tmp/reference-module.log

          # Its own test script runs FIRST, so a broken checker cannot approve the run it
          # is part of. The checker is what caught the vacuous `-run` filter in the MASQUE
          # interop step above; before that fix, this check had no live caller at all.
          bash scripts/ci/check-reference-coverage.test.sh
          bash scripts/ci/check-reference-coverage.sh /tmp/reference-module.log test/jiejie/reference

          cd test
          go test -tags "$TAGS" -count=1 -timeout 60m -v \
            -run 'TestJiejieNaive.*(Differential|Caddy|Reference|Parity)' \
            ./jiejie/ > /tmp/reference-differential.log 2>&1 || {
              tail -80 /tmp/reference-differential.log >&2
              exit 1
            }
          ran="$(grep -cE '^--- (PASS|FAIL|SKIP):' /tmp/reference-differential.log || true)"
          tail -20 /tmp/reference-differential.log
          if [ "$ran" -eq 0 ]; then
            echo "::error::reference differential tests matched no tests; the -run filter is stale" >&2
            exit 1
          fi
          echo "PASS: reference suite ($ran differential tests)"

      - name: deep check - MASQUE reference interop
        if: ${{ github.event_name == 'workflow_dispatch' && inputs.deep_checks }}
        run: |
          set -euo pipefail
          TAGS="$(cat release/BUILD_TAGS_JIEJIE_SERVER_MINIMAL)"
          cd test
          # The names are `TestJiejieMASQUE*` and `TestJiejieMinimalMASQUE*`, in
          # UPPERCASE. This filter used to read `TestJiejieMasque`, which is
          # case-sensitive and matched NOTHING: the step passed vacuously while
          # reporting "PASS: MASQUE reference interop". It is spelled out in full
          # here, and the count below makes a future empty match a failure rather
          # than a green tick.
          go test -tags "$TAGS" -count=1 -timeout 60m -v \
            -run 'TestJiejie(MASQUE|MinimalMASQUE)' ./jiejie/ \
            > /tmp/masque-reference.log 2>&1 || {
              tail -80 /tmp/masque-reference.log >&2
              exit 1
            }
          ran="$(grep -cE '^--- (PASS|FAIL|SKIP):' /tmp/masque-reference.log || true)"
          tail -20 /tmp/masque-reference.log
          if [ "$ran" -eq 0 ]; then
            echo "::error::MASQUE reference interop matched no tests; the -run filter is stale" >&2
            exit 1
          fi
          echo "PASS: MASQUE reference interop ($ran tests)"
