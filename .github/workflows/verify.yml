name: Verify

# Gates every push to the long-lived branch on the assumptions this fork makes about the code it pins.
#
# # Why this workflow exists, and what it is not
#
# The artifact workflows are manual dispatch on purpose: they build, sign, smoke-test and upload, and
# a push should not pay 20 minutes for that. But until this workflow existed, NOTHING ran on a push.
# Thirteen commits of local semantic change could sit on `testing` with no verification at all, and
# the fork's riskiest failure mode - upstream changing underneath a local assumption - had no gate
# anywhere.
#
# So this is the cheap half: the tripwires that fail when an upstream revision changes what something
# MEANS, plus the build matrix that fails when it changes what something IS. It deliberately does not
# run the full unit suite, the race suite or any artifact step; those stay in the artifact workflows
# where they are asked for explicitly.
on:
  push:
    branches: [testing]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-go@v5
        with:
          go-version-file: go.mod
          cache: true
          cache-dependency-path: |
            go.sum
            test/go.sum

      - name: gofmt
        run: |
          set -euo pipefail
          unformatted="$(gofmt -l cmd include option protocol route service transport common dns adapter 2>&1 || true)"
          if [ -n "$unformatted" ]; then
            echo "FAIL: these files are not gofmt-clean:" >&2
            echo "$unformatted" >&2
            exit 1
          fi
          echo "PASS: gofmt clean"

      - name: pinned-upstream assumptions
        # The one step that exists for a fork: it fails when an upstream revision changes the meaning
        # of something this fork relies on, and it prints where each assumption lives.
        run: ./scripts/ci/verify-upstream-assumptions.sh

      - name: build matrix
        # A signature change upstream is a build failure here rather than a silent behaviour change
        # later. The main binary is not built for every target: only the packages this fork changes,
        # because the artifact workflows own the products.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS)"
          packages="./common/trafficclass/... ./common/trafficsched/... ./common/dialer/... ./protocol/direct/... ./protocol/tun/... ./protocol/group/... ./route/... ./option/..."
          for target in linux/amd64 windows/amd64 freebsd/amd64; do
            goos="${target%%/*}"
            goarch="${target##*/}"
            echo "--- ${goos}/${goarch}"
            GOOS="$goos" GOARCH="$goarch" CGO_ENABLED=0 go build -tags "$tags" $packages
          done
          echo "--- darwin/arm64 low_memory"
          GOOS=darwin GOARCH=arm64 CGO_ENABLED=0 go build -tags "$tags,low_memory" ./common/trafficsched/... ./protocol/tun/... ./route/...
          echo "PASS: build matrix"

      # The loadbalance box-level tests (test/loadbalance_group_test.go) are NOT run here.
      #
      # They pass locally and they are the strongest oracle this feature has - a real
      # connection through a real box - but running the test module on a Linux runner trips a
      # PRE-EXISTING goroutine leak in the systemd-resolved DNS transport, and the module's
      # TestMain fails the run on it:
      #
      #   dns/transport/local.(*DBusResolvedResolver).loopUpdateStatus
      #     dns/transport/local/local_resolved_linux.go:349, created by Start (:192)
      #
      # loopUpdateStatus ranges over a channel that only D-Bus would close. Close() shuts the
      # system bus down (:216) but nothing ever closes that channel, so the goroutine blocks
      # for the life of the process. It is unconditional on that path and unrelated to this
      # feature - any box test on a Linux runner with D-Bus systemd-resolved present would do
      # the same - and it is recorded in docs/RELEASE-CERTIFICATE.md rather than worked around
      # here. To run them by hand, on a machine where the leak is not hit or with the resolver
      # disabled:
      #
      #   cd test && go test -tags "$(cat ../release/DEFAULT_BUILD_TAGS_OTHERS)" \
      #     -run 'TestLoadBalance' .

      - name: race on the fork's own data paths
        # Bounded to the packages the fork actually changed. The artifact workflows own the full race
        # suite; this is the subset where a fork-local regression would land first.
        #
        # The configuration surface is a separate step because the `option` package's TEST binary
        # links cronet (through a naive-related test), and no Linux product links cronet: the server
        # profile is release/DEFAULT_BUILD_TAGS_OTHERS, which has no with_naive_outbound. Running it
        # under the server profile covers every decode, schema and round-trip test in the package,
        # and it is what Linux actually ships.
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS)"
          go test -race -count=1 -timeout 30m -tags "$tags" ./common/trafficclass/... ./common/trafficsched/... ./common/dialer/... ./protocol/direct/... ./protocol/tun/... ./route/... ./adapter/...

      - name: race on the configuration surface
        run: |
          set -euo pipefail
          tags="$(cat release/DEFAULT_BUILD_TAGS_OTHERS)"
          go test -race -count=1 -timeout 30m -tags "$tags" ./option/...
